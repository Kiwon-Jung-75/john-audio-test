ext":"And when she heard it, she rose quickly and went to him."},{"chapter":11,"number":30,"file":"11.30.mp3","text":"Now Jesus had not yet come into the village, but was still in the place where Martha had met him."},{"chapter":11,"number":31,"file":"11.31.mp3","text":"When the Jews who were with her in the house, consoling her, saw Mary rise quickly and go out, they followed her, supposing that she was going to the tomb to weep there."},{"chapter":11,"number":32,"file":"11.32.mp3","text":"Now when Mary came to where Jesus was and saw him, she fell at his feet, saying to him, “Lord, if you had been here, my brother would not have died.”"},{"chapter":11,"number":33,"file":"11.33.mp3","text":"When Jesus saw her weeping, and the Jews who had come with her also weeping, he was deeply moved in his spirit and greatly troubled."},{"chapter":11,"number":34,"file":"11.34.mp3","text":"And he said, “Where have you laid him?” They said to him, “Lord, come and see.”"},{"chapter":11,"number":35,"file":"11.35.mp3","text":"Jesus wept."},{"chapter":11,"number":36,"file":"11.36.mp3","text":"So the Jews said, “See how he loved him!”"},{"chapter":11,"number":37,"file":"11.37.mp3","text":"But some of them said, “Could not he who opened the eyes of the blind man also have kept this man from dying?”"},{"chapter":11,"number":38,"file":"11.38.mp3","text":"Then Jesus, deeply moved again, came to the tomb. It was a cave, and a stone lay against it."},{"chapter":11,"number":39,"file":"11.39.mp3","text":"Jesus said, “Take away the stone.” Martha, the sister of the dead man, said to him, “Lord, by this time there will be an odor, for he has been dead four days.”"},{"chapter":11,"number":40,"file":"11.40.mp3","text":"Jesus said to her, “Did I not tell you that if you believed you would see the glory of God?”"},{"chapter":11,"number":41,"file":"11.41.mp3","text":"So they took away the stone. And Jesus lifted up his eyes and said, “Father, I thank you that you have heard me."},{"chapter":11,"number":42,"file":"11.42.mp3","text":"I knew that you always hear me, but I said this on account of the people standing around, that they may believe that you sent me.”"},{"chapter":11,"number":43,"file":"11.43.mp3","text":"When he had said these things, he cried out with a loud voice, “Lazarus, come out.”"},{"chapter":11,"number":44,"file":"11.44.mp3","text":"The man who had died came out, his hands and feet bound with linen strips, and his face wrapped with a cloth. Jesus said to them, “Unbind him, and let him go.”"},{"chapter":11,"number":45,"file":"11.45.mp3","text":"Many of the Jews therefore, who had come with Mary and had seen what he did, believed in him,"},{"chapter":11,"number":46,"file":"11.46.mp3","text":"but some of them went to the Pharisees and told them what Jesus had done."},{"chapter":11,"number":47,"file":"11.47.mp3","text":"So the chief priests and the Pharisees gathered the council and said, “What are we to do? For this man performs many signs."},{"chapter":11,"number":48,"file":"11.48.mp3","text":"If we let him go on like this, everyone will believe in him, and the Romans will come and take away both our place and our nation.”"},{"chapter":11,"number":49,"file":"11.49.mp3","text":"But one of them, Caiaphas, who was high priest that year, said to them, “You know nothing at all."},{"chapter":11,"number":50,"file":"11.50.mp3","text":"Nor do you understand that it is better for you that one man should die for the people, not that the whole nation should perish.”"},{"chapter":11,"number":51,"file":"11.51.mp3","text":"He did not say this of his own accord, but being high priest that year he prophesied that Jesus would die for the nation,"},{"chapter":11,"number":52,"file":"11.52.mp3","text":"and not for the nation only, but also to gather into one the children of God who are scattered abroad."},{"chapter":11,"number":53,"file":"11.53.mp3","text":"So from that day on they made plans to put him to death."},{"chapter":11,"number":54,"file":"11.54.mp3","text":"Jesus therefore no longer walked openly among the Jews, but went from there to the region near the wilderness, to a town called Ephraim, and there he stayed with the disciples."},{"chapter":11,"number":55,"file":"11.55.mp3","text":"Now the Passover of the Jews was at hand, and many went up from the country to Jerusalem before the Passover to purify themselves."},{"chapter":11,"number":56,"file":"11.56.mp3","text":"They were looking for Jesus and saying to one another as they stood in the temple, “What do you think? That he will not come to the feast at all?”"},{"chapter":11,"number":57,"file":"11.57.mp3","text":"Now the chief priests and the Pharisees had given orders that if anyone knew where he was, he should let them know, so that they might arrest him."},{"chapter":12,"number":1,"file":"12.1.mp3","text":"Six days before the Passover, Jesus therefore came to Bethany, where Lazarus was, whom Jesus had raised from the dead."},{"chapter":12,"number":2,"file":"12.2.mp3","text":"So they gave a dinner for him there. Martha served, and Lazarus was one of those reclining with him at table."},{"chapter":12,"number":3,"file":"12.3.mp3","text":"Mary therefore took a pound of expensive ointment made from pure nard, and anointed the feet of Jesus and wiped his feet with her hair. The house was filled with the fragrance of the perfume."},{"chapter":12,"number":4,"file":"12.4.mp3","text":"But Judas Iscariot, one of his disciples (he who was about to betray him), said,"},{"chapter":12,"number":5,"file":"12.5.mp3","text":"“Why was this ointment not sold for three hundred denarii and given to the poor?”"},{"chapter":12,"number":6,"file":"12.6.mp3","text":"He said this, not because he cared about the poor, but because he was a thief, and having charge of the moneybag he used to help himself to what was put into it."},{"chapter":12,"number":7,"file":"12.7.mp3","text":"Jesus said, “Leave her alone, so that she may keep it for the day of my burial."},{"chapter":12,"number":8,"file":"12.8.mp3","text":"For the poor you always have with you, but you do not always have me.”"},{"chapter":12,"number":9,"file":"12.9.mp3","text":"When the large crowd of the Jews learned that Jesus was there, they came, not only on account of him but also to see Lazarus, whom he had raised from the dead."},{"chapter":12,"number":10,"file":"12.10.mp3","text":"So the chief priests made plans to put Lazarus to death as well,"},{"chapter":12,"number":11,"file":"12.11.mp3","text":"because on account of him many of the Jews were going away and believing in Jesus."},{"chapter":12,"number":12,"file":"12.12.mp3","text":"The next day the large crowd that had come to the feast heard that Jesus was coming to Jerusalem."},{"chapter":12,"number":13,"file":"12.13.mp3","text":"So they took branches of palm trees and went out to meet him, crying out, “Hosanna! Blessed is he who comes in the name of the Lord, even the King of Israel!”"},{"chapter":12,"number":14,"file":"12.14.mp3","text":"And Jesus found a young donkey and sat on it, just as it is written,"},{"chapter":12,"number":15,"file":"12.15.mp3","text":"“Fear not, daughter of Zion;behold, your king is coming,sitting on a donkey's colt!”"},{"chapter":12,"number":16,"file":"12.16.mp3","text":"His disciples did not understand these things at first, but when Jesus was glorified, then they remembered that these things had been written about him and had been done to him."},{"chapter":12,"number":17,"file":"12.17.mp3","text":"The crowd that had been with him when he called Lazarus out of the tomb and raised him from the dead continued to bear witness."},{"chapter":12,"number":18,"file":"12.18.mp3","text":"The reason why the crowd went to meet him was that they heard he had done this sign."},{"chapter":12,"number":19,"file":"12.19.mp3","text":"So the Pharisees said to one another, “You see that you are gaining nothing. Look, the world has gone after him.”"},{"chapter":12,"number":20,"file":"12.20.mp3","text":"Now among those who went up to worship at the feast were some Greeks."},{"chapter":12,"number":21,"file":"12.21.mp3","text":"So these came to Philip, who was from Bethsaida in Galilee, and asked him, “Sir, we wish to see Jesus.”"},{"chapter":12,"number":22,"file":"12.22.mp3","text":"Philip went and told Andrew; Andrew and Philip went and told Jesus."},{"chapter":12,"number":23,"file":"12.23.mp3","text":"And Jesus answered them, “The hour has come for the Son of Man to be glorified."},{"chapter":12,"number":24,"file":"12.24.mp3","text":"Truly, truly, I say to you, unless a grain of wheat falls into the earth and dies, it remains alone; but if it dies, it bears much fruit."},{"chapter":12,"number":25,"file":"12.25.mp3","text":"Whoever loves his life loses it, and whoever hates his life in this world will keep it for eternal life."},{"chapter":12,"number":26,"file":"12.26.mp3","text":"If anyone serves me, he must follow me; and where I am, there will my servant be also. If anyone serves me, the Father will honor him."},{"chapter":12,"number":27,"file":"12.27.mp3","text":"“Now is my soul troubled. And what shall I say? ‘Father, save me from this hour’? But for this purpose I have come to this hour."},{"chapter":12,"number":28,"file":"12.28.mp3","text":"Father, glorify your name.” Then a voice came from heaven: “I have glorified it, and I will glorify it again.”"},{"chapter":12,"number":29,"file":"12.29.mp3","text":"The crowd that stood there and heard it said that it had thundered. Others said, “An angel has spoken to him.”"},{"chapter":12,"number":30,"file":"12.30.mp3","text":"Jesus answered, “This voice has come for your sake, not mine."},{"chapter":12,"number":31,"file":"12.31.mp3","text":"Now is the judgment of this world; now will the ruler of this world be cast out."},{"chapter":12,"number":32,"file":"12.32.mp3","text":"And I, when I am lifted up from the earth, will draw all people to myself.”"},{"chapter":12,"number":33,"file":"12.33.mp3","text":"He said this to show by what kind of death he was going to die."},{"chapter":12,"number":34,"file":"12.34.mp3","text":"So the crowd answered him, “We have heard from the Law that the Christ remains forever. How can you say that the Son of Man must be lifted up? Who is this Son of Man?”"},{"chapter":12,"number":35,"file":"12.35.mp3","text":"So Jesus said to them, “The light is among you for a little while longer. Walk while you have the light, lest darkness overtake you. The one who walks in the darkness does not know where he is going."},{"chapter":12,"number":36,"file":"12.36.mp3","text":"While you have the light, believe in the light, that you may become sons of light.” When Jesus had said these things, he departed and hid himself from them."},{"chapter":12,"number":37,"file":"12.37.mp3","text":"Though he had done so many signs before them, they still did not believe in him,"},{"chapter":12,"number":38,"file":"12.38.mp3","text":"so that the word spoken by the prophet Isaiah might be fulfilled:“Lord, who has believed what he heard from us,and to whom has the arm of the Lord been revealed?”"},{"chapter":12,"number":39,"file":"12.39.mp3","text":"Therefore they could not believe. For again Isaiah said,"},{"chapter":12,"number":40,"file":"12.40.mp3","text":"“He has blinded their eyesand hardened their heart,lest they see with their eyes,and understand with their heart, and turn,and I would heal them.”"},{"chapter":12,"number":41,"file":"12.41.mp3","text":"Isaiah said these things because he saw his glory and spoke of him."},{"chapter":12,"number":42,"file":"12.42.mp3","text":"Nevertheless, many even of the authorities believed in him, but for fear of the Pharisees they did not confess it, so that they would not be put out of the synagogue;"},{"chapter":12,"number":43,"file":"12.43.mp3","text":"for they loved the glory that comes from man more than the glory that comes from God."},{"chapter":12,"number":44,"file":"12.44.mp3","text":"And Jesus cried out and said, “Whoever believes in me, believes not in me but in him who sent me."},{"chapter":12,"number":45,"file":"12.45.mp3","text":"And whoever sees me sees him who sent me."},{"chapter":12,"number":46,"file":"12.46.mp3","text":"I have come into the world as light, so that whoever believes in me may not remain in darkness."},{"chapter":12,"number":47,"file":"12.47.mp3","text":"If anyone hears my words and does not keep them, I do not judge him; for I did not come to judge the world but to save the world."},{"chapter":12,"number":48,"file":"12.48.mp3","text":"The one who rejects me and does not receive my words has a judge; the word that I have spoken will judge him on the last day."},{"chapter":12,"number":49,"file":"12.49.mp3","text":"For I have not spoken on my own authority, but the Father who sent me has himself given me a commandment—what to say and what to speak."},{"chapter":12,"number":50,"file":"12.50.mp3","text":"And I know that his commandment is eternal life. What I say, therefore, I say as the Father has told me.”"},{"chapter":13,"number":1,"file":"13.1.mp3","text":"Now before the Feast of the Passover, when Jesus knew that his hour had come to depart out of this world to the Father, having loved his own who were in the world, he loved them to the end."},{"chapter":13,"number":2,"file":"13.2.mp3","text":"During supper, when the devil had already put it into the heart of Judas Iscariot, Simon's son, to betray him,"},{"chapter":13,"number":3,"file":"13.3.mp3","text":"Jesus, knowing that the Father had given all things into his hands, and that he had come from God and was going back to God,"},{"chapter":13,"number":4,"file":"13.4.mp3","text":"rose from supper. He laid aside his outer garments, and taking a towel, tied it around his waist."},{"chapter":13,"number":5,"file":"13.5.mp3","text":"Then he poured water into a basin and began to wash the disciples' feet and to wipe them with the towel that was wrapped around him."},{"chapter":13,"number":6,"file":"13.6.mp3","text":"He came to Simon Peter, who said to him, “Lord, do you wash my feet?”"},{"chapter":13,"number":7,"file":"13.7.mp3","text":"Jesus answered him, “What I am doing you do not understand now, but afterward you will understand.”"},{"chapter":13,"number":8,"file":"13.8.mp3","text":"Peter said to him, “You shall never wash my feet.” Jesus answered him, “If I do not wash you, you have no share with me.”"},{"chapter":13,"number":9,"file":"13.9.mp3","text":"Simon Peter said to him, “Lord, not my feet only but also my hands and my head!”"},{"chapter":13,"number":10,"file":"13.10.mp3","text":"Jesus said to him, “The one who has bathed does not need to wash, except for his feet, but is completely clean. And you are clean, but not every one of you.”"},{"chapter":13,"number":11,"file":"13.11.mp3","text":"For he knew who was to betray him; that was why he said, “Not all of you are clean.”"},{"chapter":13,"number":12,"file":"13.12.mp3","text":"When he had washed their feet and put on his outer garments and resumed his place, he said to them, “Do you understand what I have done to you?"},{"chapter":13,"number":13,"file":"13.13.mp3","text":"You call me Teacher and Lord, and you are right, for so I am."},{"chapter":13,"number":14,"file":"13.14.mp3","text":"If I then, your Lord and Teacher, have washed your feet, you also ought to wash one another's feet."},{"chapter":13,"number":15,"file":"13.15.mp3","text":"For I have given you an example, that you also should do just as I have done to you."},{"chapter":13,"number":16,"file":"13.16.mp3","text":"Truly, truly, I say to you, a servant is not greater than his master, nor is a messenger greater than the one who sent him."},{"chapter":13,"number":17,"file":"13.17.mp3","text":"If you know these things, blessed are you if you do them."},{"chapter":13,"number":18,"file":"13.18.mp3","text":"I am not speaking of all of you; I know whom I have chosen. But the Scripture will be fulfilled, ‘He who ate my bread has lifted his heel against me.’"},{"chapter":13,"number":19,"file":"13.19.mp3","text":"I am telling you this now, before it takes place, that when it does take place you may believe that I am he."},{"chapter":13,"number":20,"file":"13.20.mp3","text":"Truly, truly, I say to you, whoever receives the one I send receives me, and whoever receives me receives the one who sent me.”"},{"chapter":13,"number":21,"file":"13.21.mp3","text":"After saying these things, Jesus was troubled in his spirit, and testified, “Truly, truly, I say to you, one of you will betray me.”"},{"chapter":13,"number":22,"file":"13.22.mp3","text":"The disciples looked at one another, uncertain of whom he spoke."},{"chapter":13,"number":23,"file":"13.23.mp3","text":"One of his disciples, whom Jesus loved, was reclining at table at Jesus' side,"},{"chapter":13,"number":24,"file":"13.24.mp3","text":"so Simon Peter motioned to him to ask Jesus of whom he was speaking."},{"chapter":13,"number":25,"file":"13.25.mp3","text":"So that disciple, leaning back against Jesus, said to him, “Lord, who is it?”"},{"chapter":13,"number":26,"file":"13.26.mp3","text":"Jesus answered, “It is he to whom I will give this morsel of bread when I have dipped it.” So when he had dipped the morsel, he gave it to Judas, the son of Simon Iscariot."},{"chapter":13,"number":27,"file":"13.27.mp3","text":"Then after he had taken the morsel, Satan entered into him. Jesus said to him, “What you are going to do, do quickly.”"},{"chapter":13,"number":28,"file":"13.28.mp3","text":"Now no one at the table knew why he said this to him."},{"chapter":13,"number":29,"file":"13.29.mp3","text":"Some thought that, because Judas had the moneybag, Jesus was telling him, “Buy what we need for the feast,” or that he should give something to the poor."},{"chapter":13,"number":30,"file":"13.30.mp3","text":"So, after receiving the morsel of bread, he immediately went out. And it was night."},{"chapter":13,"number":31,"file":"13.31.mp3","text":"When he had gone out, Jesus said, “Now is the Son of Man glorified, and God is glorified in him."},{"chapter":13,"number":32,"file":"13.32.mp3","text":"If God is glorified in him, God will also glorify him in himself, and glorify him at once."},{"chapter":13,"number":33,"file":"13.33.mp3","text":"Little children, yet a little while I am with you. You will seek me, and just as I said to the Jews, so now I also say to you, ‘Where I am going you cannot come.’"},{"chapter":13,"number":34,"file":"13.34.mp3","text":"A new commandment I give to you, that you love one another: just as I have loved you, you also are to love one another."},{"chapter":13,"number":35,"file":"13.35.mp3","text":"By this all people will know that you are my disciples, if you have love for one another.”"},{"chapter":13,"number":36,"file":"13.36.mp3","text":"Simon Peter said to him, “Lord, where are you going?” Jesus answered him, “Where I am going you cannot follow me now, but you will follow afterward.”"},{"chapter":13,"number":37,"file":"13.37.mp3","text":"Peter said to him, “Lord, why can I not follow you now? I will lay down my life for you.”"},{"chapter":13,"number":38,"file":"13.38.mp3","text":"Jesus answered, “Will you lay down your life for me? Truly, truly, I say to you, the rooster will not crow till you have denied me three times."},{"chapter":14,"number":1,"file":"14.1.mp3","text":"“Let not your hearts be troubled. Believe in God; believe also in me."},{"chapter":14,"number":2,"file":"14.2.mp3","text":"In my Father's house are many rooms. If it were not so, would I have told you that I go to prepare a place for you?"},{"chapter":14,"number":3,"file":"14.3.mp3","text":"And if I go and prepare a place for you, I will come again and will take you to myself, that where I am you may be also."},{"chapter":14,"number":4,"file":"14.4.mp3","text":"And you know the way to where I am going.”"},{"chapter":14,"number":5,"file":"14.5.mp3","text":"Thomas said to him, “Lord, we do not know where you are going. How can we know the way?”"},{"chapter":14,"number":6,"file":"14.6.mp3","text":"Jesus said to him, “I am the way, and the truth, and the life. No one comes to the Father except through me."},{"chapter":14,"number":7,"file":"14.7.mp3","text":"If you had known me, you would have known my Father also. From now on you do know him and have seen him.”"},{"chapter":14,"number":8,"file":"14.8.mp3","text":"Philip said to him, “Lord, show us the Father, and it is enough for us.”"},{"chapter":14,"number":9,"file":"14.9.mp3","text":"Jesus said to him, “Have I been with you so long, and you still do not know me, Philip? Whoever has seen me has seen the Father. How can you say, ‘Show us the Father’?"},{"chapter":14,"number":10,"file":"14.10.mp3","text":"Do you not believe that I am in the Father and the Father is in me? The words that I say to you I do not speak on my own authority, but the Father who dwells in me does his works."},{"chapter":14,"number":11,"file":"14.11.mp3","text":"Believe me that I am in the Father and the Father is in me, or else believe on account of the works themselves."},{"chapter":14,"number":12,"file":"14.12.mp3","text":"“Truly, truly, I say to you, whoever believes in me will also do the works that I do; and greater works than these will he do, because I am going to the Father.러"},{"chapter":14,"number":13,"file":"14.13.mp3","text":"Whatever you ask in my name, this I will do, that the Father may be glorified in the Son."},{"chapter":14,"number":14,"file":"14.14.mp3","text":"If you ask me anything in my name, I will do it."},{"chapter":14,"number":15,"file":"14.15.mp3","text":"“If you love me, you will keep my commandments."},{"chapter":14,"number":16,"file":"14.16.mp3","text":"And I will ask the Father, and he will give you another Helper, to be with you forever,"},{"chapter":14,"number":17,"file":"14.17.mp3","text":"even the Spirit of truth, whom the world cannot receive, because it neither sees him nor knows him. You know him, for he dwells with you and will be in you."},{"chapter":14,"number":18,"file":"14.18.mp3","text":"“I will not leave you as orphans; I will come to you."},{"chapter":14,"number":19,"file":"14.19.mp3","text":"Yet a little while and the world will see me no more, but you will see me. Because I live, you also will live."},{"chapter":14,"number":20,"file":"14.20.mp3","text":"In that day you will know that I am in my Father, and you in me, and I in you."},{"chapter":14,"number":21,"file":"14.21.mp3","text":"Whoever has my commandments and keeps them, he it is who loves me. And he who loves me will be loved by my Father, and I will love him and manifest myself to him.”"},{"chapter":14,"number":22,"file":"14.22.mp3","text":"Judas (not Iscariot) said to him, “Lord, how is it that you will manifest yourself to us, and not to the world?”"},{"chapter":14,"number":23,"file":"14.23.mp3","text":"Jesus answered him, “If anyone loves me, he will keep my word, and my Father will love him, and we will come to him and make our home with him."},{"chapter":14,"number":24,"file":"14.24.mp3","text":"Whoever does not love me does not keep my words. And the word that you hear is not mine but the Father's who sent me."},{"chapter":14,"number":25,"file":"14.25.mp3","text":"“These things I have spoken to you while I am still with you."},{"chapter":14,"number":26,"file":"14.26.mp3","text":"But the Helper, the Holy Spirit, whom the Father will send in my name, he will teach you all things and bring to your remembrance all that I have said to you."},{"chapter":14,"number":27,"file":"14.27.mp3","text":"Peace I leave with you; my peace I give to you. Not as the world gives do I give to you. Let not your hearts be troubled, neither let them be afraid."},{"chapter":14,"number":28,"file":"14.28.mp3","text":"You heard me say to you, ‘I am going away, and I will come to you.’ If you loved me, you would have rejoiced, because I am going to the Father, for the Father is greater than I."},{"chapter":14,"number":29,"file":"14.29.mp3","text":"And now I have told you before it takes place, so that when it does take place you may believe."},{"chapter":14,"number":30,"file":"14.30.mp3","text":"I will no longer talk much with you, for the ruler of this world is coming. He has no claim on me,"},{"chapter":14,"number":31,"file":"14.31.mp3","text":"but I do as the Father has commanded me, so that the world may know that I love the Father. Rise, let us go from here."},{"chapter":15,"number":1,"file":"15.1.mp3","text":"“I am the true vine, and my Father is the vinedresser."},{"chapter":15,"number":2,"file":"15.2.mp3","text":"Every branch in me that does not bear fruit he takes away, and every branch that does bear fruit he prunes, that it may bear more fruit."},{"chapter":15,"number":3,"file":"15.3.mp3","text":"Already you are clean because of the word that I have spoken to you."},{"chapter":15,"number":4,"file":"15.4.mp3","text":"Abide in me, and I in you. As the branch cannot bear fruit by itself, unless it abides in the vine, neither can you, unless you abide in me."},{"chapter":15,"number":5,"file":"15.5.mp3","text":"I am the vine; you are the branches. Whoever abides in me and I in him, he it is that bears much fruit, for apart from me you can do nothing."},{"chapter":15,"number":6,"file":"15.6.mp3","text":"If anyone does not abide in me he is thrown away like a branch and withers; and the branches are gathered, thrown into the fire, and burned."},{"chapter":15,"number":7,"file":"15.7.mp3","text":"If you abide in me, and my words abide in you, ask whatever you wish, and it will be done for you."},{"chapter":15,"number":8,"file":"15.8.mp3","text":"By this my Father is glorified, that you bear much fruit and so prove to be my disciples."},{"chapter":15,"number":9,"file":"15.9.mp3","text":"As the Father has loved me, so have I loved you. Abide in my love."},{"chapter":15,"number":10,"file":"15.10.mp3","text":"If you keep my commandments, you will abide in my love, just as I have kept my Father's commandments and abide in his love."},{"chapter":15,"number":11,"file":"15.11.mp3","text":"These things I have spoken to you, that my joy may be in you, and that your joy may be full."},{"chapter":15,"number":12,"file":"15.12.mp3","text":"“This is my commandment, that you love one another as I have loved you."},{"chapter":15,"number":13,"file":"15.13.mp3","text":"Greater love has no one than this, that someone lay down his life for his friends."},{"chapter":15,"number":14,"file":"15.14.mp3","text":"You are my friends if you do what I command you."},{"chapter":15,"number":15,"file":"15.15.mp3","text":"No longer do I call you servants, for the servant does not know what his master is doing; but I have called you friends, for all that I have heard from my Father I have made known to you."},{"chapter":15,"number":16,"file":"15.16.mp3","text":"You did not choose me, but I chose you and appointed you that you should go and bear fruit and that your fruit should abide, so that whatever you ask the Father in my name, he may give it to you."},{"chapter":15,"number":17,"file":"15.17.mp3","text":"These things I command you, so that you will love one another."},{"chapter":15,"number":18,"file":"15.18.mp3","text":"“If the world hates you, know that it has hated me before it hated you."},{"chapter":15,"number":19,"file":"15.19.mp3","text":"If you were of the world, the world would love you as its own; but because you are not of the world, but I chose you out of the world, therefore the world hates you."},{"chapter":15,"number":20,"file":"15.20.mp3","text":"Remember the word that I said to you: ‘A servant is not greater than his master.’ If they persecuted me, they will also persecute you. If they kept my word, they will also keep yours."},{"chapter":15,"number":21,"file":"15.21.mp3","text":"But all these things they will do to you on account of my name, because they do not know him who sent me."},{"chapter":15,"number":22,"file":"15.22.mp3","text":"If I had not come and spoken to them, they would not have been guilty of sin, but now they have no excuse for their sin."},{"chapter":15,"number":23,"file":"15.23.mp3","text":"Whoever hates me hates my Father also."},{"chapter":15,"number":24,"file":"15.24.mp3","text":"If I had not done among them the works that no one else did, they would not be guilty of sin, but now they have seen and hated both me and my Father."},{"chapter":15,"number":25,"file":"15.25.mp3","text":"But the word that is written in their Law must be fulfilled: ‘They hated me without a cause.’"},{"chapter":15,"number":26,"file":"15.26.mp3","text":"“But when the Helper comes, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father, he will bear witness about me."},{"chapter":15,"number":27,"file":"15.27.mp3","text":"And you also will bear witness, because you have been with me from the beginning."},{"chapter":16,"number":1,"file":"16.1.mp3","text":"“I have said all these things to you to keep you from falling away."},{"chapter":16,"number":2,"file":"16.2.mp3","text":"They will put you out of the synagogues. Indeed, the hour is coming when whoever kills you will think he is offering service to God."},{"chapter":16,"number":3,"file":"16.3.mp3","text":"And they will do these things because they have not known the Father, nor me."},{"chapter":16,"number":4,"file":"16.4.mp3","text":"But I have said these things to you, that when their hour comes you may remember that I told them to you. “I did not say these things to you from the beginning, because I was with you."},{"chapter":16,"number":5,"file":"16.5.mp3","text":"But now I am going to him who sent me, and none of you asks me, ‘Where are you going?’"},{"chapter":16,"number":6,"file":"16.6.mp3","text":"But because I have said these things to you, sorrow has filled your heart."},{"chapter":16,"number":7,"file":"16.7.mp3","text":"Nevertheless, I tell you the truth: it is to your advantage that I go away, for if I do not go away, the Helper will not come to you. But if I go, I will send him to you."},{"chapter":16,"number":8,"file":"16.8.mp3","text":"And when he comes, he will convict the world concerning sin and righteousness and judgment:"},{"chapter":16,"number":9,"file":"16.9.mp3","text":"concerning sin, because they do not believe in me;"},{"chapter":16,"number":10,"file":"16.10.mp3","text":"concerning righteousness, because I go to the Father, and you will see me no longer;"},{"chapter":16,"number":11,"file":"16.11.mp3","text":"concerning judgment, because the ruler of this world is judged."},{"chapter":16,"number":12,"file":"16.12.mp3","text":"“I still have many things to say to you, but you cannot bear them now."},{"chapter":16,"number":13,"file":"16.13.mp3","text":"When the Spirit of truth comes, he will guide you into all the truth, for he will not speak on his own authority, but whatever he hears he will speak, and he will declare to you the things that are to come."},{"chapter":16,"number":14,"file":"16.14.mp3","text":"He will glorify me, for he will take what is mine and declare it to you."},{"chapter":16,"number":15,"file":"16.15.mp3","text":"All that the Father has is mine; therefore I said that he will take what is mine and declare it to you."},{"chapter":16,"number":16,"file":"16.16.mp3","text":"“A little while, and you will see me no longer; and again a little while, and you will see me.”"},{"chapter":16,"number":17,"file":"16.17.mp3","text":"So some of his disciples said to one another, “What is this that he says to us, ‘A little while, and you will not see me, and again a little while, and you will see me’; and, ‘because I am going to the Father’?”"},{"chapter":16,"number":18,"file":"16.18.mp3","text":"So they were saying, “What does he mean by ‘a little while’? We do not know what he is talking about.”"},{"chapter":16,"number":19,"file":"16.19.mp3","text":"Jesus knew that they wanted to ask him, so he said to them, “Is this what you are asking yourselves, what I meant by saying, ‘A little while and you will not see me, and again a little while and you will see me’?"},{"chapter":16,"number":20,"file":"16.20.mp3","text":"Truly, truly, I say to you, you will weep and lament, but the world will rejoice. You will be sorrowful, but your sorrow will turn into joy."},{"chapter":16,"number":21,"file":"16.21.mp3","text":"When a woman is giving birth, she has sorrow because her hour has come, but when she has delivered the baby, she no longer remembers the anguish, for joy that a human being has been born into the world."},{"chapter":16,"number":22,"file":"16.22.mp3","text":"So also you have sorrow now, but I will see you again, and your hearts will rejoice, and no one will take your joy from you."},{"chapter":16,"number":23,"file":"16.23.mp3","text":"In that day you will ask nothing of me. Truly, truly, I say to you, whatever you ask of the Father in my name, he will give it to you."},{"chapter":16,"number":24,"file":"16.24.mp3","text":"Until now you have asked nothing in my name. Ask, and you will receive, that your joy may be full."},{"chapter":16,"number":25,"file":"16.25.mp3","text":"“I have said these things to you in figures of speech. The hour is coming when I will no longer speak to you in figures of speech but will tell you plainly about the Father."},{"chapter":16,"number":26,"file":"16.26.mp3","text":"In that day you will ask in my name, and I do not say to you that I will ask the Father on your behalf;"},{"chapter":16,"number":27,"file":"16.27.mp3","text":"for the Father himself loves you, because you have loved me and have believed that I came from God."},{"chapter":16,"number":28,"file":"16.28.mp3","text":"I came from the Father and have come into the world, and now I am leaving the world and going to the Father.”"},{"chapter":16,"number":29,"file":"16.29.mp3","text":"His disciples said, “Ah, now you are speaking plainly and not using figurative speech!"},{"chapter":16,"number":30,"file":"16.30.mp3","text":"Now we know that you know all things and do not need anyone to question you; this is why we believe that you came from God.”"},{"chapter":16,"number":31,"file":"16.31.mp3","text":"Jesus answered them, “Do you now believe?"},{"chapter":16,"number":32,"file":"16.32.mp3","text":"Behold, the hour is coming, indeed it has come, when you will be scattered, each to his own home, and will leave me alone. Yet I am not alone, for the Father is with me."},{"chapter":16,"number":33,"file":"16.33.mp3","text":"I have said these things to you, that in me you may have peace. In the world you will have tribulation. But take heart; I have overcome the world.”"},{"chapter":17,"number":1,"file":"17.1.mp3","text":"When Jesus had spoken these words, he lifted up his eyes to heaven, and said, “Father, the hour has come; glorify your Son that the Son may glorify you,"},{"chapter":17,"number":2,"file":"17.2.mp3","text":"since you have given him authority over all flesh, to give eternal life to all whom you have given him."},{"chapter":17,"number":3,"file":"17.3.mp3","text":"And this is eternal life, that they know you, the only true God, and Jesus Christ whom you have sent."},{"chapter":17,"number":4,"file":"17.4.mp3","text":"I glorified you on earth, having accomplished the work that you gave me to do."},{"chapter":17,"number":5,"file":"17.5.mp3","text":"And now, Father, glorify me in your own presence with the glory that I had with you before the world existed."},{"chapter":17,"number":6,"file":"17.6.mp3","text":"“I have manifested your name to the people whom you gave me out of the world. Yours they were, and you gave them to me, and they have kept your word."},{"chapter":17,"number":7,"file":"17.7.mp3","text":"Now they know that everything that you have given me is from you."},{"chapter":17,"number":8,"file":"17.8.mp3","text":"For I have given them the words that you gave me, and they have received them and have come to know in truth that I came from you; and they have believed that you sent me."},{"chapter":17,"number":9,"file":"17.9.mp3","text":"I am praying for them. I am not praying for the world but for those whom you have given me, for they are yours."},{"chapter":17,"number":10,"file":"17.10.mp3","text":"All mine are yours, and yours are mine, and I am glorified in them."},{"chapter":17,"number":11,"file":"17.11.mp3","text":"And I am no longer in the world, but they are in the world, and I am coming to you. Holy Father, keep them in your name, which you have given me, that they may be one, even as we are one."},{"chapter":17,"number":12,"file":"17.12.mp3","text":"While I was with them, I kept them in your name, which you have given me. I have guarded them, and not one of them has been lost except the son of destruction, that the Scripture might be fulfilled."},{"chapter":17,"number":13,"file":"17.13.mp3","text":"But now I am coming to you, and these things I speak in the world, that they may have my joy fulfilled in themselves."},{"chapter":17,"number":14,"file":"17.14.mp3","text":"I have given them your word, and the world has hated them because they are not of the world, just as I am not of the world."},{"chapter":17,"number":15,"file":"17.15.mp3","text":"I do not ask that you take them out of the world, but that you keep them from the evil one."},{"chapter":17,"number":16,"file":"17.16.mp3","text":"They are not of the world, just as I am not of the world."},{"chapter":17,"number":17,"file":"17.17.mp3","text":"Sanctify them in the truth; your word is truth."},{"chapter":17,"number":18,"file":"17.18.mp3","text":"As you sent me into the world, so I have sent them into the world."},{"chapter":17,"number":19,"file":"17.19.mp3","text":"And for their sake I consecrate myself, that they also may be sanctified in truth."},{"chapter":17,"number":20,"file":"17.20.mp3","text":"“I do not ask for these only, but also for those who will believe in me through their word,"},{"chapter":17,"number":21,"file":"17.21.mp3","text":"that they may all be one, just as you, Father, are in me, and I in you, that they also may be in us, so that the world may believe that you have sent me."},{"chapter":17,"number":22,"file":"17.22.mp3","text":"The glory that you have given me I have given to them, that they may be one even as we are one,"},{"chapter":17,"number":23,"file":"17.23.mp3","text":"I in them and you in me, that they may become perfectly one, so that the world may know that you sent me and loved them even as you loved me."},{"chapter":17,"number":24,"file":"17.24.mp3","text":"Father, I desire that they also, whom you have given me, may be with me where I am, to see my glory that you have given me because you loved me before the foundation of the world."},{"chapter":17,"number":25,"file":"17.25.mp3","text":"O righteous Father, even though the world does not know you, I know you, and these know that you have sent me."},{"chapter":17,"number":26,"file":"17.26.mp3","text":"I made known to them your name, and I will continue to make it known, that the love with which you have loved me may be in them, and I in them.”"},{"chapter":18,"number":1,"file":"18.1.mp3","text":"When Jesus had spoken these words, he went out with his disciples across the brook Kidron, where there was a garden, which he and his disciples entered."},{"chapter":18,"number":2,"file":"18.2.mp3","text":"Now Judas, who betrayed him, also knew the place, for Jesus often met there with his disciples."},{"chapter":18,"number":3,"file":"18.3.mp3","text":"So Judas, having procured a band of soldiers and some officers from the chief priests and the Pharisees, went there with lanterns and torches and weapons."},{"chapter":18,"number":4,"file":"18.4.mp3","text":"Then Jesus, knowing all that would happen to him, came forward and said to them, “Whom do you seek?”"},{"chapter":18,"number":5,"file":"18.5.mp3","text":"They answered him, “Jesus of Nazareth.” Jesus said to them, “I am he.”  Judas, who betrayed him, was standing with them."},{"chapter":18,"number":6,"file":"18.6.mp3","text":"When Jesus said to them, “I am he,” they drew back and fell to the ground."},{"chapter":18,"number":7,"file":"18.7.mp3","text":"So he asked them again, “Whom do you seek?” And they said, “Jesus of Nazareth.”"},{"chapter":18,"number":8,"file":"18.8.mp3","text":"Jesus answered, “I told you that I am he. So, if you seek me, let these men go.”"},{"chapter":18,"number":9,"file":"18.9.mp3","text":"This was to fulfill the word that he had spoken: “Of those whom you gave me I have lost not one.”"},{"chapter":18,"number":10,"file":"18.10.mp3","text":"Then Simon Peter, having a sword, drew it and struck the high priest's servant and cut off his right ear. (The servant's name was Malchus.)"},{"chapter":18,"number":11,"file":"18.11.mp3","text":"So Jesus said to Peter, “Put your sword into its sheath; shall I not drink the cup that the Father has given me?”"},{"chapter":18,"number":12,"file":"18.12.mp3","text":"So the band of soldiers and their captain and the officers of the Jews arrested Jesus and bound him."},{"chapter":18,"number":13,"file":"18.13.mp3","text":"First they led him to Annas, for he was the father-in-law of Caiaphas, who was high priest that year."},{"chapter":18,"number":14,"file":"18.14.mp3","text":"It was Caiaphas who had advised the Jews that it would be expedient that one man should die for the people."},{"chapter":18,"number":15,"file":"18.15.mp3","text":"Simon Peter followed Jesus, and so did another disciple. Since that disciple was known to the high priest, he entered with Jesus into the courtyard of the high priest,"},{"chapter":18,"number":16,"file":"18.16.mp3","text":"but Peter stood outside at the door. So the other disciple, who was known to the high priest, went out and spoke to the servant girl who kept watch at the door, and brought Peter in."},{"chapter":18,"number":17,"file":"18.17.mp3","text":"The servant girl at the door said to Peter, “You also are not one of this man's disciples, are you?” He said, “I am not.”"},{"chapter":18,"number":18,"file":"18.18.mp3","text":"Now the servants and officers had made a charcoal fire, because it was cold, and they were standing and warming themselves. Peter also was with them, standing and warming himself."},{"chapter":18,"number":19,"file":"18.19.mp3","text":"The high priest then questioned Jesus about his disciples and his teaching."},{"chapter":18,"number":20,"file":"18.20.mp3","text":"Jesus answered him, “I have spoken openly to the world. I have always taught in synagogues and in the temple, where all Jews come together. I have said nothing in secret."},{"chapter":18,"number":21,"file":"18.21.mp3","text":"Why do you ask me? Ask those who have heard me what I said to them; they know what I said.”"},{"chapter":18,"number":22,"file":"18.22.mp3","text":"When he had said these things, one of the officers standing by struck Jesus with his hand, saying, “Is that how you answer the high priest?”"},{"chapter":18,"number":23,"file":"18.23.mp3","text":"Jesus answered him, “If what I said is wrong, bear witness about the wrong; but if what I said is right, why do you strike me?”"},{"chapter":18,"number":24,"file":"18.24.mp3","text":"Annas then sent him bound to Caiaphas the high priest."},{"chapter":18,"number":25,"file":"18.25.mp3","text":"Now Simon Peter was standing and warming himself. So they said to him, “You also are not one of his disciples, are you?” He denied it and said, “I am not.”"},{"chapter":18,"number":26,"file":"18.26.mp3","text":"One of the servants of the high priest, a relative of the man whose ear Peter had cut off, asked, “Did I not see you in the garden with him?”"},{"chapter":18,"number":27,"file":"18.27.mp3","text":"Peter again denied it, and at once a rooster crowed."},{"chapter":18,"number":28,"file":"18.28.mp3","text":"Then they led Jesus from the house of Caiaphas to the governor's headquarters. It was early morning. They themselves did not enter the governor's headquarters, so that they would not be defiled, but could eat the Passover."},{"chapter":18,"number":29,"file":"18.29.mp3","text":"So Pilate went outside to them and said, “What accusation do you bring against this man?”"},{"chapter":18,"number":30,"file":"18.30.mp3","text":"They answered him, “If this man were not doing evil, we would not have delivered him over to you.”"},{"chapter":18,"number":31,"file":"18.31.mp3","text":"Pilate said to them, “Take him yourselves and judge him by your own law.” The Jews said to him, “It is not lawful for us to put anyone to death.”"},{"chapter":18,"number":32,"file":"18.32.mp3","text":"This was to fulfill the word that Jesus had spoken to show by what kind of death he was going to die."},{"chapter":18,"number":33,"file":"18.33.mp3","text":"So Pilate entered his headquarters again and called Jesus and said to him, “Are you the King of the Jews?”"},{"chapter":18,"number":34,"file":"18.34.mp3","text":"Jesus answered, “Do you say this of your own accord, or did others say it to you about me?”"},{"chapter":18,"number":35,"file":"18.35.mp3","text":"Pilate answered, “Am I a Jew? Your own nation and the chief priests have delivered you over to me. What have you done?”"},{"chapter":18,"number":36,"file":"18.36.mp3","text":"Jesus answered, “My kingdom is not of this world. If my kingdom were of this world, my servants would have been fighting, that I might not be delivered over to the Jews. But my kingdom is not from the world.”"},{"chapter":18,"number":37,"file":"18.37.mp3","text":"Then Pilate said to him, “So you are a king?” Jesus answered, “You say that I am a king. For this purpose I was born and for this purpose I have come into the world—to bear witness to the truth. Everyone who is of the truth listens to my voice.”"},{"chapter":18,"number":38,"file":"18.38.mp3","text":"Pilate said to him, “What is truth?” After he had said this, he went back outside to the Jews and told them, “I find no guilt in him."},{"chapter":18,"number":39,"file":"18.39.mp3","text":"But you have a custom that I should release one man for you at the Passover. So do you want me to release to you the King of the Jews?”"},{"chapter":18,"number":40,"file":"18.40.mp3","text":"They cried out again, “Not this man, but Barabbas!” Now Barabbas was a robber."},{"chapter":19,"number":1,"file":"19.1.mp3","text":"Then Pilate took Jesus and flogged him."},{"chapter":19,"number":2,"file":"19.2.mp3","text":"And the soldiers twisted together a crown of thorns and put it on his head and arrayed him in a purple robe."},{"chapter":19,"number":3,"file":"19.3.mp3","text":"They came up to him, saying, “Hail, King of the Jews!” and struck him with their hands."},{"chapter":19,"number":4,"file":"19.4.mp3","text":"Pilate went out again and said to them, “See, I am bringing him out to you that you may know that I find no guilt in him.”"},{"chapter":19,"number":5,"file":"19.5.mp3","text":"So Jesus came out, wearing the crown of thorns and the purple robe. Pilate said to them, “Behold the man!”"},{"chapter":19,"number":6,"file":"19.6.mp3","text":"When the chief priests and the officers saw him, they cried out, “Crucify him, crucify him!” Pilate said to them, “Take him yourselves and crucify him, for I find no guilt in him.”"},{"chapter":19,"number":7,"file":"19.7.mp3","text":"The Jews answered him, “We have a law, and according to that law he ought to die because he has made himself the Son of God.”"},{"chapter":19,"number":8,"file":"19.8.mp3","text":"When Pilate heard this statement, he was even more afraid."},{"chapter":19,"number":9,"file":"19.9.mp3","text":"He entered his headquarters again and said to Jesus, “Where are you from?” But Jesus gave him no answer."},{"chapter":19,"number":10,"file":"19.10.mp3","text":"So Pilate said to him, “You will not speak to me? Do you not know that I have authority to release you and authority to crucify you?”"},{"chapter":19,"number":11,"file":"19.11.mp3","text":"Jesus answered him, “You would have no authority over me at all unless it had been given you from above. Therefore he who delivered me over to you has the greater sin.”"},{"chapter":19,"number":12,"file":"19.12.mp3","text":"From then on Pilate sought to release him, but the Jews cried out, “If you release this man, you are not Caesar's friend. Everyone who makes himself a king opposes Caesar.”"},{"chapter":19,"number":13,"file":"19.13.mp3","text":"So when Pilate heard these words, he brought Jesus out and sat down on the judgment seat at a place called The Stone Pavement, and in Aramaic Gabbatha."},{"chapter":19,"number":14,"file":"19.14.mp3","text":"Now it was the day of Preparation of the Passover. It was about the sixth hour. He said to the Jews, “Behold your King!”"},{"chapter":19,"number":15,"file":"19.15.mp3","text":"They cried out, “Away with him, away with him, crucify him!” Pilate said to them, “Shall I crucify your King?” The chief priests answered, “We have no king but Caesar.”"},{"chapter":19,"number":16,"file":"19.16.mp3","text":"So he delivered him over to them to be crucified. So they took Jesus,"},{"chapter":19,"number":17,"file":"19.17.mp3","text":"and he went out, bearing his own cross, to the place called The Place of a Skull, which in Aramaic is called Golgotha."},{"chapter":19,"number":18,"file":"19.18.mp3","text":"There they crucified him, and with him two others, one on either side, and Jesus between them."},{"chapter":19,"number":19,"file":"19.19.mp3","text":"Pilate also wrote an inscription and put it on the cross. It read, “Jesus of Nazareth, the King of the Jews.”"},{"chapter":19,"number":20,"file":"19.20.mp3","text":"Many of the Jews read this inscription, for the place where Jesus was crucified was near the city, and it was written in Aramaic, in Latin, and in Greek."},{"chapter":19,"number":21,"file":"19.21.mp3","text":"So the chief priests of the Jews said to Pilate, “Do not write, ‘The King of the Jews,’ but rather, ‘This man said, I am King of the Jews.’”"},{"chapter":19,"number":22,"file":"19.22.mp3","text":"Pilate answered, “What I have written I have written.”"},{"chapter":19,"number":23,"file":"19.23.mp3","text":"When the soldiers had crucified Jesus, they took his garments and divided them into four parts, one part for each soldier; also his tunic. But the tunic was seamless, woven in one piece from top to bottom,"},{"chapter":19,"number":24,"file":"19.24.mp3","text":"so they said to one another, “Let us not tear it, but cast lots for it to see whose it shall be.” This was to fulfill the Scripture which says,“They divided my garments among them,and for my clothing they cast lots.” So the soldiers did these things,"},{"chapter":19,"number":25,"file":"19.25.mp3","text":"but standing by the cross of Jesus were his mother and his mother's sister, Mary the wife of Clopas, and Mary Magdalene."},{"chapter":19,"number":26,"file":"19.26.mp3","text":"When Jesus saw his mother and the disciple whom he loved standing nearby, he said to his mother, “Woman, behold, your son!”"},{"chapter":19,"number":27,"file":"19.27.mp3","text":"Then he said to the disciple, “Behold, your mother!” And from that hour the disciple took her to his own home."},{"chapter":19,"number":28,"file":"19.28.mp3","text":"After this, Jesus, knowing that all was now finished, said (to fulfill the Scripture), “I thirst.”"},{"chapter":19,"number":29,"file":"19.29.mp3","text":"A jar full of sour wine stood there, so they put a sponge full of the sour wine on a hyssop branch and held it to his mouth."},{"chapter":19,"number":30,"file":"19.30.mp3","text":"When Jesus had received the sour wine, he said, “It is finished,” and he bowed his head and gave up his spirit."},{"chapter":19,"number":31,"file":"19.31.mp3","text":"Since it was the day of Preparation, and so that the bodies would not remain on the cross on the Sabbath (for that Sabbath was a high day), the Jews asked Pilate that their legs might be broken and that they might be taken away."},{"chapter":19,"number":32,"file":"19.32.mp3","text":"So the soldiers came and broke the legs of the first, and of the other who had been crucified with him."},{"chapter":19,"number":33,"file":"19.33.mp3","text":"But when they came to Jesus and saw that he was already dead, they did not break his legs."},{"chapter":19,"number":34,"file":"19.34.mp3","text":"But one of the soldiers pierced his side with a spear, and at once there came out blood and water."},{"chapter":19,"number":35,"file":"19.35.mp3","text":"He who saw it has borne witness—his testimony is true, and he knows that he is telling the truth—that you also may believe."},{"chapter":19,"number":36,"file":"19.36.mp3","text":"For these things took place that the Scripture might be fulfilled: “Not one of his bones will be broken.”"},{"chapter":19,"number":37,"file":"19.37.mp3","text":"And again another Scripture says, “They will look on him whom they have pierced.”"},{"chapter":19,"number":38,"file":"19.38.mp3","text":"After these things Joseph of Arimathea, who was a disciple of Jesus, but secretly for fear of the Jews, asked Pilate that he might take away the body of Jesus, and Pilate gave him permission. So he came and took away his body."},{"chapter":19,"number":39,"file":"19.39.mp3","text":"Nicodemus also, who earlier had come to Jesus by night, came bringing a mixture of myrrh and aloes, about seventy-five pounds in weight."},{"chapter":19,"number":40,"file":"19.40.mp3","text":"So they took the body of Jesus and bound it in linen cloths with the spices, as is the burial custom of the Jews."},{"chapter":19,"number":41,"file":"19.41.mp3","text":"Now in the place where he was crucified there was a garden, and in the garden a new tomb in which no one had yet been laid."},{"chapter":19,"number":42,"file":"19.42.mp3","text":"So because of the Jewish day of Preparation, since the tomb was close at hand, they laid Jesus there."},{"chapter":20,"number":1,"file":"20.1.mp3","text":"Now on the first day of the week Mary Magdalene came to the tomb early, while it was still dark, and saw that the stone had been taken away from the tomb."},{"chapter":20,"number":2,"file":"20.2.mp3","text":"So she ran and went to Simon Peter and the other disciple, the one whom Jesus loved, and said to them, “They have taken the Lord out of the tomb, and we do not know where they have laid him.”"},{"chapter":20,"number":3,"file":"20.3.mp3","text":"So Peter went out with the other disciple, and they were going toward the tomb."},{"chapter":20,"number":4,"file":"20.4.mp3","text":"Both of them were running together, but the other disciple outran Peter and reached the tomb first."},{"chapter":20,"number":5,"file":"20.5.mp3","text":"And stooping to look in, he saw the linen cloths lying there, but he did not go in."},{"chapter":20,"number":6,"file":"20.6.mp3","text":"Then Simon Peter came, following him, and went into the tomb. He saw the linen cloths lying there,"},{"chapter":20,"number":7,"file":"20.7.mp3","text":"and the face cloth, which had been on Jesus' head, not lying with the linen cloths but folded up in a place by itself."},{"chapter":20,"number":8,"file":"20.8.mp3","text":"Then the other disciple, who had reached the tomb first, also went in, and he saw and believed;"},{"chapter":20,"number":9,"file":"20.9.mp3","text":"for as yet they did not understand the Scripture, that he must rise from the dead."},{"chapter":20,"number":10,"file":"20.10.mp3","text":"Then the disciples went back to their homes."},{"chapter":20,"number":11,"file":"20.11.mp3","text":"But Mary stood weeping outside the tomb, and as she wept she stooped to look into the tomb."},{"chapter":20,"number":12,"file":"20.12.mp3","text":"And she saw two angels in white, sitting where the body of Jesus had lain, one at the head and one at the feet."},{"chapter":20,"number":13,"file":"20.13.mp3","text":"They said to her, “Woman, why are you weeping?” She said to them, “They have taken away my Lord, and I do not know where they have laid him.”"},{"chapter":20,"number":14,"file":"20.14.mp3","text":"Having said this, she turned around and saw Jesus standing, but she did not know that it was Jesus."},{"chapter":20,"number":15,"file":"20.15.mp3","text":"Jesus said to her, “Woman, why are you weeping? Whom are you seeking?” Supposing him to be the gardener, she said to him, “Sir, if you have carried him away, tell me where you have laid him, and I will take him away.”"},{"chapter":20,"number":16,"file":"20.16.mp3","text":"Jesus said to her, “Mary.” She turned and said to him in Aramaic, “Rabboni!” (which means Teacher)."},{"chapter":20,"number":17,"file":"20.17.mp3","text":"Jesus said to her, “Do not cling to me, for I have not yet ascended to the Father; but go to my brothers and say to them, ‘I am ascending to my Father and your Father, to my God and your God.’”"},{"chapter":20,"number":18,"file":"20.18.mp3","text":"Mary Magdalene went and announced to the disciples, “I have seen the Lord”—and that he had said these things to her."},{"chapter":20,"number":19,"file":"20.19.mp3","text":"On the evening of that day, the first day of the week, the doors being locked where the disciples were for fear of the Jews, Jesus came and stood among them and said to them, “Peace be with you.”"},{"chapter":20,"number":20,"file":"20.20.mp3","text":"When he had said this, he showed them his hands and his side. Then the disciples were glad when they saw the Lord."},{"chapter":20,"number":21,"file":"20.21.mp3","text":"Jesus said to them again, “Peace be with you. As the Father has sent me, even so I am sending you.”"},{"chapter":20,"number":22,"file":"20.22.mp3","text":"And when he had said this, he breathed on them and said to them, “Receive the Holy Spirit."},{"chapter":20,"number":23,"file":"20.23.mp3","text":"If you forgive the sins of any, they are forgiven them; if you withhold forgiveness from any, it is withheld.”"},{"chapter":20,"number":24,"file":"20.24.mp3","text":"Now Thomas, one of the twelve, called the Twin, was not with them when Jesus came."},{"chapter":20,"number":25,"file":"20.25.mp3","text":"So the other disciples told him, “We have seen the Lord.” But he said to them, “Unless I see in his hands the mark of the nails, and place my finger into the mark of the nails, and place my hand into his side, I will never believe.”"},{"chapter":20,"number":26,"file":"20.26.mp3","text":"Eight days later, his disciples were inside again, and Thomas was with them. Although the doors were locked, Jesus came and stood among them and said, “Peace be with you.”"},{"chapter":20,"number":27,"file":"20.27.mp3","text":"Then he said to Thomas, “Put your finger here, and see my hands; and put out your hand, and place it in my side. Do not disbelieve, but believe.”"},{"chapter":20,"number":28,"file":"20.28.mp3","text":"Thomas answered him, “My Lord and my God!”"},{"chapter":20,"number":29,"file":"20.29.mp3","text":"Jesus said to him, “Have you believed because you have seen me? Blessed are those who have not seen and yet have believed.”"},{"chapter":20,"number":30,"file":"20.30.mp3","text":"Now Jesus did many other signs in the presence of the disciples, which are not written in this book;"},{"chapter":20,"number":31,"file":"20.31.mp3","text":"but these are written so that you may believe that Jesus is the Christ, the Son of God, and that by believing you may have life in his name."},{"chapter":21,"number":1,"file":"21.1.mp3","text":"After this Jesus revealed himself again to the disciples by the Sea of Tiberias, and he revealed himself in this way."},{"chapter":21,"number":2,"file":"21.2.mp3","text":"Simon Peter, Thomas (called the Twin), Nathanael of Cana in Galilee, the sons of Zebedee, and two others of his disciples were together."},{"chapter":21,"number":3,"file":"21.3.mp3","text":"Simon Peter said to them, “I am going fishing.” They said to him, “We will go with you.” They went out and got into the boat, but that night they caught nothing."},{"chapter":21,"number":4,"file":"21.4.mp3","text":"Just as day was breaking, Jesus stood on the shore; yet the disciples did not know that it was Jesus."},{"chapter":21,"number":5,"file":"21.5.mp3","text":"Jesus said to them, “Children, do you have any fish?” They answered him, “No.”"},{"chapter":21,"number":6,"file":"21.6.mp3","text":"He said to them, “Cast the net on the right side of the boat, and you will find some.” So they cast it, and now they were not able to haul it in, because of the quantity of fish."},{"chapter":21,"number":7,"file":"21.7.mp3","text":"That disciple whom Jesus loved therefore said to Peter, “It is the Lord!” When Simon Peter heard that it was the Lord, he put on his outer garment, for he was stripped for work, and threw himself into the sea."},{"chapter":21,"number":8,"file":"21.8.mp3","text":"The other disciples came in the boat, dragging the net full of fish, for they were not far from the land, but about a hundred yards off."},{"chapter":21,"number":9,"file":"21.9.mp3","text":"When they got out on land, they saw a charcoal fire in place, with fish laid out on it, and bread."},{"chapter":21,"number":10,"file":"21.10.mp3","text":"Jesus said to them, “Bring some of the fish that you have just caught.”"},{"chapter":21,"number":11,"file":"21.11.mp3","text":"So Simon Peter went aboard and hauled the net ashore, full of large fish, 153 of them. And although there were so many, the net was not torn."},{"chapter":21,"number":12,"file":"21.12.mp3","text":"Jesus said to them, “Come and have breakfast.” Now none of the disciples dared ask him, “Who are you?” They knew it was the Lord."},{"chapter":21,"number":13,"file":"21.13.mp3","text":"Jesus came and took the bread and gave it to them, and so with the fish."},{"chapter":21,"number":14,"file":"21.14.mp3","text":"This was now the third time that Jesus was revealed to the disciples after he was raised from the dead."},{"chapter":21,"number":15,"file":"21.15.mp3","text":"When they had finished breakfast, Jesus said to Simon Peter, “Simon, son of John, do you love me more than these?” He said to him, “Yes, Lord; you know that I love you.” He said to him, “Feed my lambs.”"},{"chapter":21,"number":16,"file":"21.16.mp3","text":"He said to him a second time, “Simon, son of John, do you love me?” He said to him, “Yes, Lord; you know that I love you.” He said to him, “Tend my sheep.”"},{"chapter":21,"number":17,"file":"21.17.mp3","text":"He said to him the third time, “Simon, son of John, do you love me?” Peter was grieved because he said to him the third time, “Do you love me?” and he said to him, “Lord, you know everything; you know that I love you.” Jesus said to him, “Feed my sheep."},{"chapter":21,"number":18,"file":"21.18.mp3","text":"Truly, truly, I say to you, when you were young, you used to dress yourself and walk wherever you wanted, but when you are old, you will stretch out your hands, and another will dress you and carry you where you do not want to go.”"},{"chapter":21,"number":19,"file":"21.19.mp3","text":"(This he said to show by what kind of death he was to glorify God.) And after saying this he said to him, “Follow me.”"},{"chapter":21,"number":20,"file":"21.20.mp3","text":"Peter turned and saw the disciple whom Jesus loved following them, the one who also had leaned back against him during the supper and had said, “Lord, who is it that is going to betray you?”"},{"chapter":21,"number":21,"file":"21.21.mp3","text":"When Peter saw him, he said to Jesus, “Lord, what about this man?”"},{"chapter":21,"number":22,"file":"21.22.mp3","text":"Jesus said to him, “If it is my will that he remain until I come, what is that to you? You follow me!”"},{"chapter":21,"number":23,"file":"21.23.mp3","text":"So the saying spread abroad among the brothers that this disciple was not to die; yet Jesus did not say to him that he was not to die, but, “If it is my will that he remain until I come, what is that to you?”"},{"chapter":21,"number":24,"file":"21.24.mp3","text":"This is the disciple who is bearing witness about these things, and who has written these things, and we know that his testimony is true."},{"chapter":21,"number":25,"file":"21.25.mp3","text":"Now there are also many other things that Jesus did. Were every one of them to be written, I suppose that the world itself could not contain the books that would be written."}];
const reader=document.getElementById('reader'),audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),previous=document.getElementById('previous'),next=document.getElementById('next'),mute=document.getElementById('mute'),status=document.getElementById('status');
let current=-1,gesture=null,suppressClickUntil=0,loadVersion=0;
const format=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'—';
function update(){const duration=audio.duration;document.getElementById('time').textContent=format(audio.currentTime)+' / '+format(duration);seek.disabled=!(Number.isFinite(duration)&&duration>0);if(!seek.disabled)seek.value=Math.round(audio.currentTime/duration*1000);play.textContent=audio.paused?'▶':'❚❚';play.setAttribute('aria-label',audio.paused?'재생':'일시 정지');}
function show(index,autoplay=false){if(index<0||index>=verses.length||index===current)return;loadVersion++;audio.pause();current=index;const verse=verses[index];if(verse.file){audio.src=verse.file;audio.load();}else{audio.removeAttribute('src');audio.load();}play.disabled=!verse.file;seek.value=0;seek.disabled=true;status.textContent='';document.getElementById('words').textContent=verse.text;document.getElementById('reference').textContent=verse.number+'절';document.getElementById('chapterTitle').textContent='요한복음 '+verse.chapter+'장';document.getElementById('trackTitle').textContent='John '+verse.chapter+':'+verse.number;document.title='요한복음 '+verse.chapter+'장 '+verse.number+'절';const p=verses[index-1],n=verses[index+1];previous.textContent=p?'← '+(p.chapter===verse.chapter?p.number+'절':p.chapter+'장 '+p.number+'절'):'처음 절';next.textContent=n?(n.chapter===verse.chapter?n.number+'절':n.chapter+'장 '+n.number+'절')+' →':'마지막 절';previous.disabled=index===0;next.disabled=index===verses.length-1;reader.dataset.verse=verse.chapter+'.'+verse.number;if(!verse.file)status.textContent='이 절은 현재 ESV 본문과 오디오에 없습니다.';window.scrollTo(0,0);update();if(autoplay&&verse.file)startAudio();}
function startAudio(){const version=loadVersion;status.textContent='';const result=audio.play();if(result)result.catch(error=>{if(version!==loadVersion||error.name==='AbortError')return;status.textContent=error.name==='NotAllowedError'?'처음 한 번 재생 버튼을 눌러 주세요. 이후 절을 넘기면 자동으로 재생됩니다.':'재생되지 않습니다. 잠시 후 재생 버튼을 다시 눌러 주세요.';update();});}
play.addEventListener('click',()=>{if(audio.paused)startAudio();else audio.pause();});
mute.addEventListener('click',()=>{audio.muted=!audio.muted;mute.querySelector('span').textContent=audio.muted?'음소거':'소리';mute.setAttribute('aria-pressed',String(audio.muted));mute.setAttribute('aria-label',audio.muted?'소리 켜기':'소리 끄기');});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;});
for(const event of ['loadedmetadata','durationchange','timeupdate','play','pause','ended'])audio.addEventListener(event,update);
audio.addEventListener('error',()=>{if(!verses[current]?.file)return;status.textContent=verses[current].file+' 파일을 불러오지 못했습니다. 파일 이름과 업로드 위치를 확인해 주세요.';});
previous.addEventListener('click',()=>show(current-1,true));next.addEventListener('click',()=>show(current+1,true));
reader.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('input,a'))return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};if(!e.target.closest('button'))reader.setPointerCapture(e.pointerId);},true);
reader.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4){suppressClickUntil=performance.now()+500;show(current+(dx<0?1:-1),true);}},true);
reader.addEventListener('pointercancel',()=>gesture=null,true);
reader.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('keydown',e=>{if(e.target.closest('input'))return;if(e.key==='ArrowLeft')show(current-1,true);if(e.key==='ArrowRight')show(current+1,true);});
const params=new URLSearchParams(location.search);const initial=verses.findIndex(v=>v.chapter===Number(params.get('c')||1)&&v.number===Number(params.get('v')||params.get('start')||1));show(initial<0?0:initial);
</script>

<script>

/* Numeric chapter and verse picker for every John entry. */
(()=>{

const css=document.createElement('style');css.textContent=`
header .pick-trigger{font:inherit;color:inherit;background:transparent;border:1px solid #d8d2cd;border-radius:24px;padding:7px 12px;min-height:34px;white-space:nowrap;-webkit-tap-highlight-color:transparent}
header .pick-trigger[aria-expanded="true"]{background:#eae5e0;border-color:#b8afa7;color:#28251f}
.number-picker{margin:12px 0 4px;padding:12px 8px;border:1px solid #ded8d2;border-radius:16px;background:#faf8f5;box-shadow:0 4px 16px #453a3010}
.number-picker[hidden],.number-picker [hidden]{display:none!important}
.picker-top{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px;color:#756f69;font-size:12px}
.picker-close{border:0;border-radius:50%;background:transparent;color:#756f69;font-size:21px;width:30px;height:30px;padding:0}
.number-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px 4px}
.number-grid button{min-width:0;min-height:32px;padding:5px 0;border:1px solid #d8d2cd;border-radius:18px;background:transparent;color:#625c56;font:500 12px/1.1 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.number-grid button[aria-pressed="true"]{background:#302e2b;border-color:#302e2b;color:white}
.number-grid button:active{background:#e7e1da;color:#302e2b}
.picker-verse-title{margin:14px 4px 9px;font-size:12px;color:#756f69;font-weight:500}
@media(min-width:600px){.number-grid button{min-height:38px;font-size:14px}.number-picker{padding:14px 16px}}
`;document.head.append(css);
const makeTrigger=id=>{const old=document.getElementById(id),b=document.createElement('button');b.type='button';b.id=id;b.className='pick-trigger';b.textContent=old.textContent;b.setAttribute('aria-controls','numberPicker');b.setAttribute('aria-expanded','false');old.replaceWith(b);return b;};
const chapterTrigger=makeTrigger('chapterTitle'),verseTrigger=makeTrigger('reference');
chapterTrigger.setAttribute('aria-label','장 선택');verseTrigger.setAttribute('aria-label','절 선택');
const panel=document.createElement('section');panel.id='numberPicker';panel.className='number-picker';panel.hidden=true;panel.setAttribute('aria-label','장과 절 선택');
panel.innerHTML='<div class="picker-top"><span id="pickerTitle"></span><button type="button" class="picker-close" aria-label="선택 닫기">×</button></div><div id="chapterGrid" class="number-grid" role="group" aria-label="장 목록"></div><div id="verseSection" hidden><h2 class="picker-verse-title" id="versePickerTitle"></h2><div id="verseGrid" class="number-grid" role="group" aria-label="절 목록"></div></div>';
reader.querySelector('header').after(panel);
const chapterGrid=panel.querySelector('#chapterGrid'),verseGrid=panel.querySelector('#verseGrid'),verseSection=panel.querySelector('#verseSection');let pendingChapter=1,openedBy=null,mode='';
function closePicker(returnFocus=false){panel.hidden=true;chapterTrigger.setAttribute('aria-expanded','false');verseTrigger.setAttribute('aria-expanded','false');if(returnFocus&&openedBy)openedBy.focus();}
function numberButton(n,label,selected,action){const b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(selected));b.addEventListener('click',action);return b;}
function renderVerses(){verseGrid.replaceChildren();for(const [index,v] of verses.entries()){if(v.chapter!==pendingChapter)continue;verseGrid.append(numberButton(v.number,pendingChapter+'장 '+v.number+'절',index===current,()=>{closePicker();if(index!==current)show(index,true);else verseTrigger.focus();}));}panel.querySelector('#versePickerTitle').textContent=pendingChapter+'장 · 절 선택';verseSection.hidden=false;}
function renderChapters(){chapterGrid.replaceChildren();for(let c=1;c<=21;c++)chapterGrid.append(numberButton(c,c+'장',c===pendingChapter,()=>{pendingChapter=c;renderChapters();renderVerses();}));}
function openPicker(nextMode,trigger){if(!panel.hidden&&mode===nextMode){closePicker();return;}pendingChapter=verses[current].chapter;mode=nextMode;openedBy=trigger;chapterGrid.hidden=mode!=='chapter';verseSection.hidden=true;panel.querySelector('#pickerTitle').textContent=mode==='chapter'?'장 선택 후 절을 선택해 주세요':'절 선택';if(mode==='chapter')renderChapters();else renderVerses();panel.hidden=false;chapterTrigger.setAttribute('aria-expanded',String(mode==='chapter'));verseTrigger.setAttribute('aria-expanded',String(mode==='verse'));}
chapterTrigger.addEventListener('click',()=>openPicker('chapter',chapterTrigger));verseTrigger.addEventListener('click',()=>openPicker('verse',verseTrigger));panel.querySelector('.picker-close').addEventListener('click',()=>closePicker(true));
reader.addEventListener('pointerdown',e=>{if(e.target.closest('.number-picker,.pick-trigger'))gesture=null;},true);
document.addEventListener('click',e=>{if(!panel.hidden&&!e.composedPath().includes(panel)&&!e.target.closest('.pick-trigger'))closePicker();});
document.addEventListener('keydown',e=>{if(panel.hidden)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();closePicker(true);}else if(e.target.closest('.number-picker')&&(e.key==='ArrowLeft'||e.key==='ArrowRight'))e.stopImmediatePropagation();},true);
new MutationObserver(()=>closePicker()).observe(reader,{attributes:true,attributeFilter:['data-verse']});
})();

</script>

 너에게","and he would have given you","엔 히 우르-헵 기븐 유"],["생수를","living water.","리빙 워럴"]],"4.11":[["여자가 그에게 말했다","The woman said to him,","더 워먼 쎋 투 힘"],["선생님, 당신은 아무것도 없습니다","Sir, you have nothing","썰 유 해브 낫띵"],["물을 길을","to draw water with,","투 즈로우 워럴 윝"],["그리고 우물은 깊은데","and the well is deep.","앤 더 웰 이쓰 딮"],["어디서 당신은 얻습니까","Where do you get","웨얼 두 유 겥"],["그 생수를?","that living water?","뎉 리빙 워럴"]],"4.12":[["당신이 더 크십니까","Are you greater","엔 유 그뤠이럴"],["우리 조상 야곱보다","than our father Jacob?","덴 아월 파덜 제이콥"],["그는 우리에게 이 우물을 주었고","He gave us the well","히 게이브 어쓰 더 웰"],["그리고 그것으로부터 마셨습니다","and drank from it","엔 즈뤵크 프롬 잍"],["자신도","himself,","힘쎌프"],["그의 아들들과 그의 짐승들처럼","as did his sons and his livestock","에즈 딛 힜-쏜쓰 엔 히쓰 라이브스탘"]],"4.13":[["예수께서 그녀에게 말씀하셨다","Jesus said to her,","지저-쎋-투 헐"],["누구든지 마시는 자는","Everyone who drinks","에브리원 후 즈륑쓰"],["이 물로부터","of this water","어브 디쓰 워럴"],["다시 목마를 것이다","will be thirsty again","윌 비 떨쓰티 어겐"]],"4.53":[["아버지는 알았다","The father knew","더 파덜 뉴"],["그 때인 것을","that was the hour","데!-워쓰 더 아월"],["예수께서 그에게 말씀하셨던","when Jesus had said to him,","웬 지저쓰 헫 쎋-투 힘"],["\"네 아들이 살 것이다\"라고 \"","Your son will live.\"","유얼 쏜 윌 리브"],["그리고 그 자신이 믿었다","And he himself believed,","앤 히 힘쎌프 빌리브드"],["그리고 그의 온 집안이","and all his household.","앤 올 히쓰 하우스홀드"]],"4.54":[["이것은 다시 두 번째 표적이었다","This was now the second sign","디스 워쓰 나우 더 쎄컨-싸인"],["예수께서 행하신","that Jesus did","덷 지저쓰 디드"],["오셨을 때","when he had come","웬 히 헫 컴"],["유대에서 갈릴리로","from Judea to Galilee.","프론 쥬대 투 겔럴리"]],"4.50":[["예수께서 그에게 말씀하셨다","Jesus said to him,","지저-쎋-투 힘"],["\"가라; 네 아들이 살 것이다\" \"","Go; your son will live.\"","고우, 유얼 쏜 윌 리브"],["그 사람은 믿었다","The man believed","더 멘 빌리브드"],["말씀을","the word","더 워드"],["예수께서 그에게 하신","that Jesus spoke to him","뎉 지저-쓰포큰 투 힘"],["그리고 갔다 그의 길을","and went on his way.","엔 웨-논 히쓰 웨이"]],"4.51":[["그가 내려가고 있을 때","As he was going down,","에즈 히 워쓰 고잉 다운"],["그의 종들이 맞이했다 그를","his servants met him","힛-썰번츠 메-팀"],["그리고 전했다","and told him","엔 톨드 힘"],["그의 아이가 살았다고","that his son was recovering.","뎉 힛-쏜 워쓰 뤼커버링 athers worshiped","아월 파덜쓰 월십드"],["이 산에서","on this mountain,","온 디쓰 마운튼"],["그러나 당신들은 말합니다","but you say","벝 유 쎄이"],["예루살렘에","that in Jerusalem","데-린 쥬루살렘"],["그 장소가 있다","is the place","이쓰 더 플레이쓰"],["사람들이 예배해야 할","where people ought to worship","웨얼 피쁠 오-투 월십"]],"4.47":[["이 사람이 들었을 때","When this man heard","웬 디쓰 멘 헐드"],["예수께서 오셨다는 것을","that Jesus had come","뎉 지저쓰 헤드 컴"],["유대에서 갈릴리로","from Judea to Galilee,","프롬 쥬대 투 겔럴리"],["그는 그에게 가서","he went to him","히 웬-투 힘"],["청했다 그에게","and asked him","엔 에쓰트 힘"],["내려오셔서","to come down","투 컴 다운"],["고쳐 달라고 그의 아들을","and heal his son,","엔 힐 힛-쏜"],["이는 때문이었다","for","폴"],["그가 죽게 되었기","he was at the point of death.","히 워쓰 엩-떠 포이-넙 데쓰"]],"4.48":[["그래서 예수께서 그에게 말씀하셨다","So Jesus said to him,","쏘 지젓-쎋-투 힘"],["너희는 보지 않으면","Unless you see","언레스 유 씨"],["표적과 기사를","signs and wonders","싸인쓰 앤 원덜쓰"],["믿지 않으려 한다","you will not believe.","유 윌 낱 빌리브"]],"4.49":[["신하가 그에게 말했다","The official said to him","디 오피셜 쎋-투 힘"],["선생님, 내려오소서","Sir, come down","썰, 컴 다운"],["내 아이가 죽기 전에","before my child dies.","비폴 마이 촤일-다이쓰"]],"4.45":[["그래서 그가 왔을 때","So when he came","쏘 웬 히 케임"],["갈릴리에","to Galilee,","투 겔럴리"],["갈릴리 사람들이 환영했다 그를","the Galileans welcomed him,","더 겔럴리언쓰 웰컴드 힘"],["보았기 때문에","having seen","해빙 씬"],["모든 것을","all that","올 뎃"],["그가 행하셨던","he had done","히 핻-던"],["예루살렘에서 명절에","in Jerusalem at the feast.","인 쥬루살렘 엩 떠 피스트"],["이는 그들도 갔었기 때문이다","For they too had gone","폴 데이 투 핻 건"],["명절에","to the feast.","투 더 피스트"]],"4.46":[["그래서 그는 다시 오셨다","So he came again","쏘 히 케임 어겐"],["갈릴리 가나로","to Cana in Galilee,","투 케이나 인 겔럴리"],["그가 만들었던 곳","where he had made","웨얼 히 핻 메이드"],["물을 포도주로","the water wine.","디 워럴 와인"],["그리고 가버나움에","And at Capernaum","앤 엩 커퍼니엄"],["한 신하가 있었다","there was an official","데얼 워쓰 언 오피셜"],["그의 아들이 병든","whose son was ill.","훗-쏜 워쓰 일"]],"4.21":[["예수께서 그녀에게 말씀하셨다","Jesus said to her,","지젓-쎋-투 헐"],["여자여, 나를 믿으라","Woman, believe me,","워먼, 빌리브 미"],["시간이 이르고 있다","the hour is coming","디 아월 이쓰 커밍"],["때","when","웬"],["이 산에서도 아니고","neither on this mountain","니덜 온 디쓰 마운

<script>
const verses=[{"chapter":1,"number":1,"file":"1.1.mp3","text":"In the beginning was the Word, and the Word was with God, and the Word was God."},{"chapter":1,"number":2,"file":"1.2.mp3","text":"He was in the beginning with God."},{"chapter":1,"number":3,"file":"1.3.mp3","text":"All things were made through him, and without him was not any thing made that was made."},{"chapter":1,"number":4,"file":"1.4.mp3","text":"In him was life, and the life was the light of men."},{"chapter":1,"number":5,"file":"1.5.mp3","text":"The light shines in the darkness, and the darkness has not overcome it."},{"chapter":1,"number":6,"file":"1.6.mp3","text":"There was a man sent from God, whose name was John."},{"chapter":1,"number":7,"file":"1.7.mp3","text":"He came as a witness, to bear witness about the light, that all might believe through him."},{"chapter":1,"number":8,"file":"1.8.mp3","text":"He was not the light, but came to bear witness about the light."},{"chapter":1,"number":9,"file":"1.9.mp3","text":"The true light, which gives light to everyone, was coming into the world."},{"chapter":1,"number":10,"file":"1.10.mp3","text":"He was in the world, and the world was made through him, yet the world did not know him."},{"chapter":1,"number":11,"file":"1.11.mp3","text":"He came to his own, and his own people did not receive him."},{"chapter":1,"number":12,"file":"1.12.mp3","text":"But to all who did receive him, who believed in his name, he gave the right to become children of God,"},{"chapter":1,"number":13,"file":"1.13.mp3","text":"who were born, not of blood nor of the will of the flesh nor of the will of man, but of God."},{"chapter":1,"number":14,"file":"1.14.mp3","text":"And the Word became flesh and dwelt among us, and we have seen his glory, glory as of the only Son from the Father, full of grace and truth."},{"chapter":1,"number":15,"file":"1.15.mp3","text":"(John bore witness about him, and cried out, “This was he of whom I said, ‘He who comes after me ranks before me, because he was before me.’”)"},{"chapter":1,"number":16,"file":"1.16.mp3","text":"For from his fullness we have all received, grace upon grace."},{"chapter":1,"number":17,"file":"1.17.mp3","text":"For the law was given through Moses; grace and truth came through Jesus Christ."},{"chapter":1,"number":18,"file":"1.18.mp3","text":"No one has ever seen God; God the only Son, who is at the Father's side, he has made him known."},{"chapter":1,"number":19,"file":"1.19.mp3","text":"And this is the testimony of John, when the Jews sent priests and Levites from Jerusalem to ask him, “Who are you?”"},{"chapter":1,"number":20,"file":"1.20.mp3","text":"He confessed, and did not deny, but confessed, “I am not the Christ.”"},{"chapter":1,"number":21,"file":"1.21.mp3","text":"And they asked him, “What then? Are you Elijah?” He said, “I am not.” “Are you the Prophet?” And he answered, “No.”"},{"chapter":1,"number":22,"file":"1.22.mp3","text":"So they said to him, “Who are you? We need to give an answer to those who sent us. What do you say about yourself?”"},{"chapter":1,"number":23,"file":"1.23.mp3","text":"He said, “I am the voice of one crying out in the wilderness, ‘Make straight the way of the Lord,’ as the prophet Isaiah said.”"},{"chapter":1,"number":24,"file":"1.24.mp3","text":"(Now they had been sent from the Pharisees.)"},{"chapter":1,"number":25,"file":"1.25.mp3","text":"They asked him, “Then why are you baptizing, if you are neither the Christ, nor Elijah, nor the Prophet?”"},{"chapter":1,"number":26,"file":"1.26.mp3","text":"John answered them, “I baptize with water, but among you stands one you do not know,"},{"chapter":1,"number":27,"file":"1.27.mp3","text":"even he who comes after me, the strap of whose sandal I am not worthy to untie.”"},{"chapter":1,"number":28,"file":"1.28.mp3","text":"These things took place in Bethany across the Jordan, where John was baptizing."},{"chapter":1,"number":29,"file":"1.29.mp3","text":"The next day he saw Jesus coming toward him, and said, “Behold, the Lamb of God, who takes away the sin of the world!"},{"chapter":1,"number":30,"file":"1.30.mp3","text":"This is he of whom I said, ‘After me comes a man who ranks before me, because he was before me.’"},{"chapter":1,"number":31,"file":"1.31.mp3","text":"I myself did not know him, but for this purpose I came baptizing with water, that he might be revealed to Israel.”"},{"chapter":1,"number":32,"file":"1.32.mp3","text":"And John bore witness: “I saw the Spirit descend from heaven like a dove, and it remained on him."},{"chapter":1,"number":33,"file":"1.33.mp3","text":"I myself did not know him, but he who sent me to baptize with water said to me, ‘He on whom you see the Spirit descend and remain, this is he who baptizes with the Holy Spirit.’"},{"chapter":1,"number":34,"file":"1.34.mp3","text":"And I have seen and have borne witness that this is the Son of God.”"},{"chapter":1,"number":35,"file":"1.35.mp3","text":"The next day again John was standing with two of his disciples,"},{"chapter":1,"number":36,"file":"1.36.mp3","text":"and he looked at Jesus as he walked by and said, “Behold, the Lamb of God!”"},{"chapter":1,"number":37,"file":"1.37.mp3","text":"The two disciples heard him say this, and they followed Jesus."},{"chapter":1,"number":38,"file":"1.38.mp3","text":"Jesus turned and saw them following and said to them, “What are you seeking?” And they said to him, “Rabbi” (which means Teacher), “where are you staying?”"},{"chapter":1,"number":39,"file":"1.39.mp3","text":"He said to them, “Come and you will see.” So they came and saw where he was staying, and they stayed with him that day, for it was about the tenth hour."},{"chapter":1,"number":40,"file":"1.40.mp3","text":"One of the two who heard John speak and followed Jesus was Andrew, Simon Peter's brother."},{"chapter":1,"number":41,"file":"1.41.mp3","text":"He first found his own brother Simon and said to him, “We have found the Messiah” (which means Christ)."},{"chapter":1,"number":42,"file":"1.42.mp3","text":"He brought him to Jesus. Jesus looked at him and said, “You are Simon the son of John. You shall be called Cephas” (which means Peter )."},{"chapter":1,"number":43,"file":"1.43.mp3","text":"The next day Jesus decided to go to Galilee. He found Philip and said to him, “Follow me.”"},{"chapter":1,"number":44,"file":"1.44.mp3","text":"Now Philip was from Bethsaida, the city of Andrew and Peter."},{"chapter":1,"number":45,"file":"1.45.mp3","text":"Philip found Nathanael and said to him, “We have found him of whom Moses in the Law and also the prophets wrote, Jesus of Nazareth, the son of Joseph.”"},{"chapter":1,"number":46,"file":"1.46.mp3","text":"Nathanael said to him, “Can anything good come out of Nazareth?” Philip said to him, “Come and see.”"},{"chapter":1,"number":47,"file":"1.47.mp3","text":"Jesus saw Nathanael coming toward him and said of him, “Behold, an Israelite indeed, in whom there is no deceit!”"},{"chapter":1,"number":48,"file":"1.48.mp3","text":"Nathanael said to him, “How do you know me?” Jesus answered him, “Before Philip called you, when you were under the fig tree, I saw you.”"},{"chapter":1,"number":49,"file":"1.49.mp3","text":"Nathanael answered him, “Rabbi, you are the Son of God! You are the King of Israel!”"},{"chapter":1,"number":50,"file":"1.50.mp3","text":"Jesus answered him, “Because I said to you, ‘I saw you under the fig tree,’ do you believe? You will see greater things than these.”"},{"chapter":1,"number":51,"file":"1.51.mp3","text":"And he said to him, “Truly, truly, I say to you, you will see heaven opened, and the angels of God ascending and descending on the Son of Man.”"},{"chapter":2,"number":1,"file":"2.1.mp3","text":"On the third day there was a wedding at Cana in Galilee, and the mother of Jesus was there."},{"chapter":2,"number":2,"file":"2.2.mp3","text":"Jesus also was invited to the wedding with his disciples."},{"chapter":2,"number":3,"file":"2.3.mp3","text":"When the wine ran out, the mother of Jesus said to him, “They have no wine.”"},{"chapter":2,"number":4,"file":"2.4.mp3","text":"And Jesus said to her, “Woman, what does this have to do with me? My hour has not yet come.”"},{"chapter":2,"number":5,"file":"2.5.mp3","text":"His mother said to the servants, “Do whatever he tells you.”"},{"chapter":2,"number":6,"file":"2.6.mp3","text":"Now there were six stone water jars there for the Jewish rites of purification, each holding twenty or thirty gallons."},{"chapter":2,"number":7,"file":"2.7.mp3","text":"Jesus said to the servants, “Fill the jars with water.” And they filled them up to the brim."},{"chapter":2,"number":8,"file":"2.8.mp3","text":"And he said to them, “Now draw some out and take it to the master of the feast.” So they took it."},{"chapter":2,"number":9,"file":"2.9.mp3","text":"When the master of the feast tasted the water now become wine, and did not know where it came from (though the servants who had drawn the water knew), the master of the feast called the bridegroom"},{"chapter":2,"number":10,"file":"2.10.mp3","text":"and said to him, “Everyone serves the good wine first, and when people have drunk freely, then the poor wine. But you have kept the good wine until now.”"},{"chapter":2,"number":11,"file":"2.11.mp3","text":"This, the first of his signs, Jesus did at Cana in Galilee, and manifested his glory. And his disciples believed in him."},{"chapter":2,"number":12,"file":"2.12.mp3","text":"After this he went down to Capernaum, with his mother and his brothers and his disciples, and they stayed there for a few days."},{"chapter":2,"number":13,"file":"2.13.mp3","text":"The Passover of the Jews was at hand, and Jesus went up to Jerusalem."},{"chapter":2,"number":14,"file":"2.14.mp3","text":"In the temple he found those who were selling oxen and sheep and pigeons, and the money-changers sitting there."},{"chapter":2,"number":15,"file":"2.15.mp3","text":"And making a whip of cords, he drove them all out of the temple, with the sheep and oxen. And he poured out the coins of the money-changers and overturned their tables."},{"chapter":2,"number":16,"file":"2.16.mp3","text":"And he told those who sold the pigeons, “Take these things away; do not make my Father's house a house of trade.”"},{"chapter":2,"number":17,"file":"2.17.mp3","text":"His disciples remembered that it was written, “Zeal for your house will consume me.”"},{"chapter":2,"number":18,"file":"2.18.mp3","text":"So the Jews said to him, “What sign do you show us for doing these things?”"},{"chapter":2,"number":19,"file":"2.19.mp3","text":"Jesus answered them, “Destroy this temple, and in three days I will raise it up.”"},{"chapter":2,"number":20,"file":"2.20.mp3","text":"The Jews then said, “It has taken forty-six years to build this temple, and will you raise it up in three days?”"},{"chapter":2,"number":21,"file":"2.21.mp3","text":"But he was speaking about the temple of his body."},{"chapter":2,"number":22,"file":"2.22.mp3","text":"When therefore he was raised from the dead, his disciples remembered that he had said this, and they believed the Scripture and the word that Jesus had spoken."},{"chapter":2,"number":23,"file":"2.23.mp3","text":"Now when he was in Jerusalem at the Passover Feast, many believed in his name when they saw the signs that he was doing."},{"chapter":2,"number":24,"file":"2.24.mp3","text":"But Jesus on his part did not entrust himself to them, because he knew all people"},{"chapter":2,"number":25,"file":"2.25.mp3","text":"and needed no one to bear witness about man, for he himself knew what was in man."},{"chapter":3,"number":1,"file":"3.1.mp3","text":"Now there was a man of the Pharisees named Nicodemus, a ruler of the Jews."},{"chapter":3,"number":2,"file":"3.2.mp3","text":"This man came to Jesus by night and said to him, “Rabbi, we know that you are a teacher come from God, for no one can do these signs that you do unless God is with him.”"},{"chapter":3,"number":3,"file":"3.3.mp3","text":"Jesus answered him, “Truly, truly, I say to you, unless one is born again he cannot see the kingdom of God.”"},{"chapter":3,"number":4,"file":"3.4.mp3","text":"Nicodemus said to him, “How can a man be born when he is old? Can he enter a second time into his mother's womb and be born?”"},{"chapter":3,"number":5,"file":"3.5.mp3","text":"Jesus answered, “Truly, truly, I say to you, unless one is born of water and the Spirit, he cannot enter the kingdom of God."},{"chapter":3,"number":6,"file":"3.6.mp3","text":"That which is born of the flesh is flesh, and that which is born of the Spirit is spirit."},{"chapter":3,"number":7,"file":"3.7.mp3","text":"Do not marvel that I said to you, ‘You must be born again.’"},{"chapter":3,"number":8,"file":"3.8.mp3","text":"The wind blows where it wishes, and you hear its sound, but you do not know where it comes from or where it goes. So it is with everyone who is born of the Spirit.”"},{"chapter":3,"number":9,"file":"3.9.mp3","text":"Nicodemus said to him, “How can these things be?”"},{"chapter":3,"number":10,"file":"3.10.mp3","text":"Jesus answered him, “Are you the teacher of Israel and yet you do not understand these things?"},{"chapter":3,"number":11,"file":"3.11.mp3","text":"Truly, truly, I say to you, we speak of what we know, and bear witness to what we have seen, but you do not receive our testimony."},{"chapter":3,"number":12,"file":"3.12.mp3","text":"If I have told you earthly things and you do not believe, how can you believe if I tell you heavenly things?"},{"chapter":3,"number":13,"file":"3.13.mp3","text":"No one has ascended into heaven except he who descended from heaven, the Son of Man."},{"chapter":3,"number":14,"file":"3.14.mp3","text":"And as Moses lifted up the serpent in the wilderness, so must the Son of Man be lifted up,"},{"chapter":3,"number":15,"file":"3.15.mp3","text":"that whoever believes in him may have eternal life."},{"chapter":3,"number":16,"file":"3.16.mp3","text":"“For God so loved the world, that he gave his only Son, that whoever believes in him should not perish but have eternal life."},{"chapter":3,"number":17,"file":"3.17.mp3","text":"For God did not send his Son into the world to condemn the world, but in order that the world might be saved through him."},{"chapter":3,"number":18,"file":"3.18.mp3","text":"Whoever believes in him is not condemned, but whoever does not believe is condemned already, because he has not believed in the name of the only Son of God."},{"chapter":3,"number":19,"file":"3.19.mp3","text":"And this is the judgment: the light has come into the world, and people loved the darkness rather than the light because their works were evil."},{"chapter":3,"number":20,"file":"3.20.mp3","text":"For everyone who does wicked things hates the light and does not come to the light, lest his works should be exposed."},{"chapter":3,"number":21,"file":"3.21.mp3","text":"But whoever does what is true comes to the light, so that it may be clearly seen that his works have been carried out in God.”"},{"chapter":3,"number":22,"file":"3.22.mp3","text":"After this Jesus and his disciples went into the Judean countryside, and he remained there with them and was baptizing."},{"chapter":3,"number":23,"file":"3.23.mp3","text":"John also was baptizing at Aenon near Salim, because water was plentiful there, and people were coming and being baptized"},{"chapter":3,"number":24,"file":"3.24.mp3","text":"(for John had not yet been put in prison)."},{"chapter":3,"number":25,"file":"3.25.mp3","text":"Now a discussion arose between some of John's disciples and a Jew over purification."},{"chapter":3,"number":26,"file":"3.26.mp3","text":"And they came to John and said to him, “Rabbi, he who was with you across the Jordan, to whom you bore witness—look, he is baptizing, and all are going to him.”"},{"chapter":3,"number":27,"file":"3.27.mp3","text":"John answered, “A person cannot receive even one thing unless it is given him from heaven."},{"chapter":3,"number":28,"file":"3.28.mp3","text":"You yourselves bear me witness, that I said, ‘I am not the Christ, but I have been sent before him.’"},{"chapter":3,"number":29,"file":"3.29.mp3","text":"The one who has the bride is the bridegroom. The friend of the bridegroom, who stands and hears him, rejoices greatly at the bridegroom's voice. Therefore this joy of mine is now complete."},{"chapter":3,"number":30,"file":"3.30.mp3","text":"He must increase, but I must decrease.”"},{"chapter":3,"number":31,"file":"3.31.mp3","text":"He who comes from above is above all. He who is of the earth belongs to the earth and speaks in an earthly way. He who comes from heaven is above all."},{"chapter":3,"number":32,"file":"3.32.mp3","text":"He bears witness to what he has seen and heard, yet no one receives his testimony."},{"chapter":3,"number":33,"file":"3.33.mp3","text":"Whoever receives his testimony sets his seal to this, that God is true."},{"chapter":3,"number":34,"file":"3.34.mp3","text":"For he whom God has sent utters the words of God, for he gives the Spirit without measure."},{"chapter":3,"number":35,"file":"3.35.mp3","text":"The Father loves the Son and has given all things into his hand."},{"chapter":3,"number":36,"file":"3.36.mp3","text":"Whoever believes in the Son has eternal life; whoever does not obey the Son shall not see life, but the wrath of God remains on him."},{"chapter":4,"number":1,"file":"4.1.mp3","text":"Now when Jesus learned that the Pharisees had heard that Jesus was making and baptizing more disciples than John"},{"chapter":4,"number":2,"file":"4.2.mp3","text":"(although Jesus himself did not baptize, but only his disciples),"},{"chapter":4,"number":3,"file":"4.3.mp3","text":"he left Judea and departed again for Galilee."},{"chapter":4,"number":4,"file":"4.4.mp3","text":"And he had to pass through Samaria."},{"chapter":4,"number":5,"file":"4.5.mp3","text":"So he came to a town of Samaria called Sychar, near the field that Jacob had given to his son Joseph."},{"chapter":4,"number":6,"file":"4.6.mp3","text":"Jacob's well was there; so Jesus, wearied as he was from his journey, was sitting beside the well. It was about the sixth hour."},{"chapter":4,"number":7,"file":"4.7.mp3","text":"A woman from Samaria came to draw water. Jesus said to her, “Give me a drink.”"},{"chapter":4,"number":8,"file":"4.8.mp3","text":"(For his disciples had gone away into the city to buy food.)"},{"chapter":4,"number":9,"file":"4.9.mp3","text":"The Samaritan woman said to him, “How is it that you, a Jew, ask for a drink from me, a woman of Samaria?” (For Jews have no dealings with Samaritans.)"},{"chapter":4,"number":10,"file":"4.10.mp3","text":"Jesus answered her, “If you knew the gift of God, and who it is that is saying to you, ‘Give me a drink,’ you would have asked him, and he would have given you living water.”"},{"chapter":4,"number":11,"file":"4.11.mp3","text":"The woman said to him, “Sir, you have nothing to draw water with, and the well is deep. Where do you get that living water?"},{"chapter":4,"number":12,"file":"4.12.mp3","text":"Are you greater than our father Jacob? He gave us the well and drank from it himself, as did his sons and his livestock.”"},{"chapter":4,"number":13,"file":"4.13.mp3","text":"Jesus said to her, “Everyone who drinks of this water will be thirsty again,"},{"chapter":4,"number":14,"file":"4.14.mp3","text":"but whoever drinks of the water that I will give him will never be thirsty again. The water that I will give him will become in him a spring of water welling up to eternal life.”"},{"chapter":4,"number":15,"file":"4.15.mp3","text":"The woman said to him, “Sir, give me this water, so that I will not be thirsty or have to come here to draw water.”"},{"chapter":4,"number":16,"file":"4.16.mp3","text":"Jesus said to her, “Go, call your husband, and come here.”"},{"chapter":4,"number":17,"file":"4.17.mp3","text":"The woman answered him, “I have no husband.” Jesus said to her, “You are right in saying, ‘I have no husband’;"},{"chapter":4,"number":18,"file":"4.18.mp3","text":"for you have had five husbands, and the one you now have is not your husband. What you have said is true.”"},{"chapter":4,"number":19,"file":"4.19.mp3","text":"The woman said to him, “Sir, I perceive that you are a prophet."},{"chapter":4,"number":20,"file":"4.20.mp3","text":"Our fathers worshiped on this mountain, but you say that in Jerusalem is the place where people ought to worship.”"},{"chapter":4,"number":21,"file":"4.21.mp3","text":"Jesus said to her, “Woman, believe me, the hour is coming when neither on this mountain nor in Jerusalem will you worship the Father."},{"chapter":4,"number":22,"file":"4.22.mp3","text":"You worship what you do not know; we worship what we know, for salvation is from the Jews."},{"chapter":4,"number":23,"file":"4.23.mp3","text":"But the hour is coming, and is now here, when the true worshipers will worship the Father in spirit and truth, for the Father is seeking such people to worship him."},{"chapter":4,"number":24,"file":"4.24.mp3","text":"God is spirit, and those who worship him must worship in spirit and truth.”"},{"chapter":4,"number":25,"file":"4.25.mp3","text":"The woman said to him, “I know that Messiah is coming (he who is called Christ). When he comes, he will tell us all things.”"},{"chapter":4,"number":26,"file":"4.26.mp3","text":"Jesus said to her, “I who speak to you am he.”"},{"chapter":4,"number":27,"file":"4.27.mp3","text":"Just then his disciples came back. They marveled that he was talking with a woman, but no one said, “What do you seek?” or, “Why are you talking with her?”"},{"chapter":4,"number":28,"file":"4.28.mp3","text":"So the woman left her water jar and went away into town and said to the people,"},{"chapter":4,"number":29,"file":"4.29.mp3","text":"“Come, see a man who told me all that I ever did. Can this be the Christ?”"},{"chapter":4,"number":30,"file":"4.30.mp3","text":"They went out of the town and were coming to him."},{"chapter":4,"number":31,"file":"4.31.mp3","text":"Meanwhile the disciples were urging him, saying, “Rabbi, eat.”"},{"chapter":4,"number":32,"file":"4.32.mp3","text":"But he said to them, “I have food to eat that you do not know about.”"},{"chapter":4,"number":33,"file":"4.33.mp3","text":"So the disciples said to one another, “Has anyone brought him something to eat?”"},{"chapter":4,"number":34,"file":"4.34.mp3","text":"Jesus said to them, “My food is to do the will of him who sent me and to accomplish his work."},{"chapter":4,"number":35,"file":"4.35.mp3","text":"Do you not say, ‘There are yet four months, then comes the harvest’? Look, I tell you, lift up your eyes, and see that the fields are white for harvest."},{"chapter":4,"number":36,"file":"4.36.mp3","text":"Already the one who reaps is receiving wages and gathering fruit for eternal life, so that sower and reaper may rejoice together."},{"chapter":4,"number":37,"file":"4.37.mp3","text":"For here the saying holds true, ‘One sows and another reaps.’"},{"chapter":4,"number":38,"file":"4.38.mp3","text":"I sent you to reap that for which you did not labor. Others have labored, and you have entered into their labor.”"},{"chapter":4,"number":39,"file":"4.39.mp3","text":"Many Samaritans from that town believed in him because of the woman's testimony, “He told me all that I ever did.”"},{"chapter":4,"number":40,"file":"4.40.mp3","text":"So when the Samaritans came to him, they asked him to stay with them, and he stayed there two days."},{"chapter":4,"number":41,"file":"4.41.mp3","text":"And many more believed because of his word."},{"chapter":4,"number":42,"file":"4.42.mp3","text":"They said to the woman, “It is no longer because of what you said that we believe, for we have heard for ourselves, and we know that this is indeed the Savior of the world.”"},{"chapter":4,"number":43,"file":"4.43.mp3","text":"After the two days he departed for Galilee."},{"chapter":4,"number":44,"file":"4.44.mp3","text":"(For Jesus himself had testified that a prophet has no honor in his own hometown.)"},{"chapter":4,"number":45,"file":"4.45.mp3","text":"So when he came to Galilee, the Galileans welcomed him, having seen all that he had done in Jerusalem at the feast. For they too had gone to the feast."},{"chapter":4,"number":46,"file":"4.46.mp3","text":"So he came again to Cana in Galilee, where he had made the water wine. And at Capernaum there was an official whose son was ill."},{"chapter":4,"number":47,"file":"4.47.mp3","text":"When this man heard that Jesus had come from Judea to Galilee, he went to him and asked him to come down and heal his son, for he was at the point of death."},{"chapter":4,"number":48,"file":"4.48.mp3","text":"So Jesus said to him, “Unless you see signs and wonders you will not believe.”"},{"chapter":4,"number":49,"file":"4.49.mp3","text":"The official said to him, “Sir, come down before my child dies.”"},{"chapter":4,"number":50,"file":"4.50.mp3","text":"Jesus said to him, “Go; your son will live.” The man believed the word that Jesus spoke to him and went on his way."},{"chapter":4,"number":51,"file":"4.51.mp3","text":"As he was going down, his servants met him and told him that his son was recovering."},{"chapter":4,"number":52,"file":"4.52.mp3","text":"So he asked them the hour when he began to get better, and they said to him, “Yesterday at the seventh hour the fever left him.”"},{"chapter":4,"number":53,"file":"4.53.mp3","text":"The father knew that was the hour when Jesus had said to him, “Your son will live.” And he himself believed, and all his household."},{"chapter":4,"number":54,"file":"4.54.mp3","text":"This was now the second sign that Jesus did when he had come from Judea to Galilee."},{"chapter":5,"number":1,"file":"5.1.mp3","text":"After this there was a feast of the Jews, and Jesus went up to Jerusalem."},{"chapter":5,"number":2,"file":"5.2.mp3","text":"Now there is in Jerusalem by the Sheep Gate a pool, in Aramaic called Bethesda, which has five roofed colonnades."},{"chapter":5,"number":3,"file":"5.3.mp3","text":"In these lay a multitude of invalids—blind, lame, and paralyzed."},{"chapter":5,"number":4,"file":null,"text":"4절(없음)"},{"chapter":5,"number":5,"file":"5.5.mp3","text":"One man was there who had been an invalid for thirty-eight years."},{"chapter":5,"number":6,"file":"5.6.mp3","text":"When Jesus saw him lying there and knew that he had already been there a long time, he said to him, “Do you want to be healed?”"},{"chapter":5,"number":7,"file":"5.7.mp3","text":"The sick man answered him, “Sir, I have no one to put me into the pool when the water is stirred up, and while I am going another steps down before me.”"},{"chapter":5,"number":8,"file":"5.8.mp3","text":"Jesus said to him, “Get up, take up your bed, and walk.”"},{"chapter":5,"number":9,"file":"5.9.mp3","text":"And at once the man was healed, and he took up his bed and walked. Now that day was the Sabbath."},{"chapter":5,"number":10,"file":"5.10.mp3","text":"So the Jews said to the man who had been healed, “It is the Sabbath, and it is not lawful for you to take up your bed.”"},{"chapter":5,"number":11,"file":"5.11.mp3","text":"But he answered them, “The man who healed me, that man said to me, ‘Take up your bed, and walk.’”"},{"chapter":5,"number":12,"file":"5.12.mp3","text":"They asked him, “Who is the man who said to you, ‘Take up your bed and walk’?”"},{"chapter":5,"number":13,"file":"5.13.mp3","text":"Now the man who had been healed did not know who it was, for Jesus had withdrawn, as there was a crowd in the place."},{"chapter":5,"number":14,"file":"5.14.mp3","text":"Afterward Jesus found him in the temple and said to him, “See, you are well! Sin no more, that nothing worse may happen to you.”"},{"chapter":5,"number":15,"file":"5.15.mp3","text":"The man went away and told the Jews that it was Jesus who had healed him."},{"chapter":5,"number":16,"file":"5.16.mp3","text":"And this was why the Jews were persecuting Jesus, because he was doing these things on the Sabbath."},{"chapter":5,"number":17,"file":"5.17.mp3","text":"But Jesus answered them, “My Father is working until now, and I am working.”"},{"chapter":5,"number":18,"file":"5.18.mp3","text":"This was why the Jews were seeking all the more to kill him, because not only was he breaking the Sabbath, but he was even calling God his own Father, making himself equal with God."},{"chapter":5,"number":19,"file":"5.19.mp3","text":"So Jesus said to them, “Truly, truly, I say to you, the Son can do nothing of his own accord, but only what he sees the Father doing. For whatever the Father does, that the Son does likewise."},{"chapter":5,"number":20,"file":"5.20.mp3","text":"For the Father loves the Son and shows him all that he himself is doing. And greater works than these will he show him, so that you may marvel."},{"chapter":5,"number":21,"file":"5.21.mp3","text":"For as the Father raises the dead and gives them life, so also the Son gives life to whom he will."},{"chapter":5,"number":22,"file":"5.22.mp3","text":"For the Father judges no one, but has given all judgment to the Son,"},{"chapter":5,"number":23,"file":"5.23.mp3","text":"that all may honor the Son, just as they honor the Father. Whoever does not honor the Son does not honor the Father who sent him."},{"chapter":5,"number":24,"file":"5.24.mp3","text":"Truly, truly, I say to you, whoever hears my word and believes him who sent me has eternal life. He does not come into judgment, but has passed from death to life."},{"chapter":5,"number":25,"file":"5.25.mp3","text":"“Truly, truly, I say to you, an hour is coming, and is now here, when the dead will hear the voice of the Son of God, and those who hear will live."},{"chapter":5,"number":26,"file":"5.26.mp3","text":"For as the Father has life in himself, so he has granted the Son also to have life in himself."},{"chapter":5,"number":27,"file":"5.27.mp3","text":"And he has given him authority to execute judgment, because he is the Son of Man."},{"chapter":5,"number":28,"file":"5.28.mp3","text":"Do not marvel at this, for an hour is coming when all who are in the tombs will hear his voice"},{"chapter":5,"number":29,"file":"5.29.mp3","text":"and come out, those who have done good to the resurrection of life, and those who have done evil to the resurrection of judgment."},{"chapter":5,"number":30,"file":"5.30.mp3","text":"“I can do nothing on my own. As I hear, I judge, and my judgment is just, because I seek not my own will but the will of him who sent me."},{"chapter":5,"number":31,"file":"5.31.mp3","text":"If I alone bear witness about myself, my testimony is not true."},{"chapter":5,"number":32,"file":"5.32.mp3","text":"There is another who bears witness about me, and I know that the testimony that he bears about me is true."},{"chapter":5,"number":33,"file":"5.33.mp3","text":"You sent to John, and he has borne witness to the truth."},{"chapter":5,"number":34,"file":"5.34.mp3","text":"Not that the testimony that I receive is from man, but I say these things so that you may be saved."},{"chapter":5,"number":35,"file":"5.35.mp3","text":"He was a burning and shining lamp, and you were willing to rejoice for a while in his light."},{"chapter":5,"number":36,"file":"5.36.mp3","text":"But the testimony that I have is greater than that of John. For the works that the Father has given me to accomplish, the very works that I am doing, bear witness about me that the Father has sent me."},{"chapter":5,"number":37,"file":"5.37.mp3","text":"And the Father who sent me has himself borne witness about me. His voice you have never heard, his form you have never seen,"},{"chapter":5,"number":38,"file":"5.38.mp3","text":"and you do not have his word abiding in you, for you do not believe the one whom he has sent."},{"chapter":5,"number":39,"file":"5.39.mp3","text":"You search the Scriptures because you think that in them you have eternal life; and it is they that bear witness about me,"},{"chapter":5,"number":40,"file":"5.40.mp3","text":"yet you refuse to come to me that you may have life."},{"chapter":5,"number":41,"file":"5.41.mp3","text":"I do not receive glory from people."},{"chapter":5,"number":42,"file":"5.42.mp3","text":"But I know that you do not have the love of God within you."},{"chapter":5,"number":43,"file":"5.43.mp3","text":"I have come in my Father's name, and you do not receive me. If another comes in his own name, you will receive him."},{"chapter":5,"number":44,"file":"5.44.mp3","text":"How can you believe, when you receive glory from one another and do not seek the glory that comes from the only God?"},{"chapter":5,"number":45,"file":"5.45.mp3","text":"Do not think that I will accuse you to the Father. There is one who accuses you: Moses, on whom you have set your hope."},{"chapter":5,"number":46,"file":"5.46.mp3","text":"For if you believed Moses, you would believe me; for he wrote of me."},{"chapter":5,"number":47,"file":"5.47.mp3","text":"But if you do not believe his writings, how will you believe my words?”"},{"chapter":6,"number":1,"file":"6.1.mp3","text":"After this Jesus went away to the other side of the Sea of Galilee, which is the Sea of Tiberias."},{"chapter":6,"number":2,"file":"6.2.mp3","text":"And a large crowd was following him, because they saw the signs that he was doing on the sick."},{"chapter":6,"number":3,"file":"6.3.mp3","text":"Jesus went up on the mountain, and there he sat down with his disciples."},{"chapter":6,"number":4,"file":"6.4.mp3","text":"Now the Passover, the feast of the Jews, was at hand."},{"chapter":6,"number":5,"file":"6.5.mp3","text":"Lifting up his eyes, then, and seeing that a large crowd was coming toward him, Jesus said to Philip, “Where are we to buy bread, so that these people may eat?”"},{"chapter":6,"number":6,"file":"6.6.mp3","text":"He said this to test him, for he himself knew what he would do."},{"chapter":6,"number":7,"file":"6.7.mp3","text":"Philip answered him, “Two hundred denarii worth of bread would not be enough for each of them to get a little.”"},{"chapter":6,"number":8,"file":"6.8.mp3","text":"One of his disciples, Andrew, Simon Peter's brother, said to him,"},{"chapter":6,"number":9,"file":"6.9.mp3","text":"“There is a boy here who has five barley loaves and two fish, but what are they for so many?”"},{"chapter":6,"number":10,"file":"6.10.mp3","text":"Jesus said, “Have the people sit down.” Now there was much grass in the place. So the men sat down, about five thousand in number."},{"chapter":6,"number":11,"file":"6.11.mp3","text":"Jesus then took the loaves, and when he had given thanks, he distributed them to those who were seated. So also the fish, as much as they wanted."},{"chapter":6,"number":12,"file":"6.12.mp3","text":"And when they had eaten their fill, he told his disciples, “Gather up the leftover fragments, that nothing may be lost.”"},{"chapter":6,"number":13,"file":"6.13.mp3","text":"So they gathered them up and filled twelve baskets with fragments from the five barley loaves left by those who had eaten."},{"chapter":6,"number":14,"file":"6.14.mp3","text":"When the people saw the sign that he had done, they said, “This is indeed the Prophet who is to come into the world!”"},{"chapter":6,"number":15,"file":"6.15.mp3","text":"Perceiving then that they were about to come and take him by force to make him king, Jesus withdrew again to the mountain by himself."},{"chapter":6,"number":16,"file":"6.16.mp3","text":"When evening came, his disciples went down to the sea,"},{"chapter":6,"number":17,"file":"6.17.mp3","text":"got into a boat, and started across the sea to Capernaum. It was now dark, and Jesus had not yet come to them."},{"chapter":6,"number":18,"file":"6.18.mp3","text":"The sea became rough because a strong wind was blowing."},{"chapter":6,"number":19,"file":"6.19.mp3","text":"When they had rowed about three or four miles, they saw Jesus walking on the sea and coming near the boat, and they were frightened."},{"chapter":6,"number":20,"file":"6.20.mp3","text":"But he said to them, “It is I; do not be afraid.”"},{"chapter":6,"number":21,"file":"6.21.mp3","text":"Then they were glad to take him into the boat, and immediately the boat was at the land to which they were going."},{"chapter":6,"number":22,"file":"6.22.mp3","text":"On the next day the crowd that remained on the other side of the sea saw that there had been only one boat there, and that Jesus had not entered the boat with his disciples, but that his disciples had gone away alone."},{"chapter":6,"number":23,"file":"6.23.mp3","text":"Other boats from Tiberias came near the place where they had eaten the bread after the Lord had given thanks."},{"chapter":6,"number":24,"file":"6.24.mp3","text":"So when the crowd saw that Jesus was not there, nor his disciples, they themselves got into the boats and went to Capernaum, seeking Jesus."},{"chapter":6,"number":25,"file":"6.25.mp3","text":"When they found him on the other side of the sea, they said to him, “Rabbi, when did you come here?”"},{"chapter":6,"number":26,"file":"6.26.mp3","text":"Jesus answered them, “Truly, truly, I say to you, you are seeking me, not because you saw signs, but because you ate your fill of the loaves."},{"chapter":6,"number":27,"file":"6.27.mp3","text":"Do not work for the food that perishes, but for the food that endures to eternal life, which the Son of Man will give to you. For on him God the Father has set his seal.”"},{"chapter":6,"number":28,"file":"6.28.mp3","text":"Then they said to him, “What must we do, to be doing the works of God?”"},{"chapter":6,"number":29,"file":"6.29.mp3","text":"Jesus answered them, “This is the work of God, that you believe in him whom he has sent.”"},{"chapter":6,"number":30,"file":"6.30.mp3","text":"So they said to him, “Then what sign do you do, that we may see and believe you? What work do you perform?"},{"chapter":6,"number":31,"file":"6.31.mp3","text":"Our fathers ate the manna in the wilderness; as it is written, ‘He gave them bread from heaven to eat.’”"},{"chapter":6,"number":32,"file":"6.32.mp3","text":"Jesus then said to them, “Truly, truly, I say to you, it was not Moses who gave you the bread from heaven, but my Father gives you the true bread from heaven."},{"chapter":6,"number":33,"file":"6.33.mp3","text":"For the bread of God is he who comes down from heaven and gives life to the world.”"},{"chapter":6,"number":34,"file":"6.34.mp3","text":"They said to him, “Sir, give us this bread always.”"},{"chapter":6,"number":35,"file":"6.35.mp3","text":"Jesus said to them, “I am the bread of life; whoever comes to me shall not hunger, and whoever believes in me shall never thirst."},{"chapter":6,"number":36,"file":"6.36.mp3","text":"But I said to you that you have seen me and yet do not believe."},{"chapter":6,"number":37,"file":"6.37.mp3","text":"All that the Father gives me will come to me, and whoever comes to me I will never cast out."},{"chapter":6,"number":38,"file":"6.38.mp3","text":"For I have come down from heaven, not to do my own will but the will of him who sent me."},{"chapter":6,"number":39,"file":"6.39.mp3","text":"And this is the will of him who sent me, that I should lose nothing of all that he has given me, but raise it up on the last day."},{"chapter":6,"number":40,"file":"6.40.mp3","text":"For this is the will of my Father, that everyone who looks on the Son and believes in him should have eternal life, and I will raise him up on the last day.”"},{"chapter":6,"number":41,"file":"6.41.mp3","text":"So the Jews grumbled about him, because he said, “I am the bread that came down from heaven.”"},{"chapter":6,"number":42,"file":"6.42.mp3","text":"They said, “Is not this Jesus, the son of Joseph, whose father and mother we know? How does he now say, ‘I have come down from heaven’?”"},{"chapter":6,"number":43,"file":"6.43.mp3","text":"Jesus answered them, “Do not grumble among yourselves."},{"chapter":6,"number":44,"file":"6.44.mp3","text":"No one can come to me unless the Father who sent me draws him. And I will raise him up on the last day."},{"chapter":6,"number":45,"file":"6.45.mp3","text":"It is written in the Prophets, ‘And they will all be taught by God.’ Everyone who has heard and learned from the Father comes to me—"},{"chapter":6,"number":46,"file":"6.46.mp3","text":"not that anyone has seen the Father except he who is from God; he has seen the Father."},{"chapter":6,"number":47,"file":"6.47.mp3","text":"Truly, truly, I say to you, whoever believes has eternal life."},{"chapter":6,"number":48,"file":"6.48.mp3","text":"I am the bread of life."},{"chapter":6,"number":49,"file":"6.49.mp3","text":"Your fathers ate the manna in the wilderness, and they died."},{"chapter":6,"number":50,"file":"6.50.mp3","text":"This is the bread that comes down from heaven, so that one may eat of it and not die."},{"chapter":6,"number":51,"file":"6.51.mp3","text":"I am the living bread that came down from heaven. If anyone eats of this bread, he will live forever. And the bread that I will give for the life of the world is my flesh.”"},{"chapter":6,"number":52,"file":"6.52.mp3","text":"The Jews then disputed among themselves, saying, “How can this man give us his flesh to eat?”"},{"chapter":6,"number":53,"file":"6.53.mp3","text":"So Jesus said to them, “Truly, truly, I say to you, unless you eat the flesh of the Son of Man and drink his blood, you have no life in you."},{"chapter":6,"number":54,"file":"6.54.mp3","text":"Whoever feeds on my flesh and drinks my blood has eternal life, and I will raise him up on the last day."},{"chapter":6,"number":55,"file":"6.55.mp3","text":"For my flesh is true food, and my blood is true drink."},{"chapter":6,"number":56,"file":"6.56.mp3","text":"Whoever feeds on my flesh and drinks my blood abides in me, and I in him."},{"chapter":6,"number":57,"file":"6.57.mp3","text":"As the living Father sent me, and I live because of the Father, so whoever feeds on me, he also will live because of me."},{"chapter":6,"number":58,"file":"6.58.mp3","text":"This is the bread that came down from heaven, not like the bread the fathers ate, and died. Whoever feeds on this bread will live forever.”"},{"chapter":6,"number":59,"file":"6.59.mp3","text":"Jesus said these things in the synagogue, as he taught at Capernaum."},{"chapter":6,"number":60,"file":"6.60.mp3","text":"When many of his disciples heard it, they said, “This is a hard saying; who can listen to it?”"},{"chapter":6,"number":61,"file":"6.61.mp3","text":"But Jesus, knowing in himself that his disciples were grumbling about this, said to them, “Do you take offense at this?"},{"chapter":6,"number":62,"file":"6.62.mp3","text":"Then what if you were to see the Son of Man ascending to where he was before?"},{"chapter":6,"number":63,"file":"6.63.mp3","text":"It is the Spirit who gives life; the flesh is no help at all. The words that I have spoken to you are spirit and life."},{"chapter":6,"number":64,"file":"6.64.mp3","text":"But there are some of you who do not believe.” (For Jesus knew from the beginning who those were who did not believe, and who it was who would betray him.)"},{"chapter":6,"number":65,"file":"6.65.mp3","text":"And he said, “This is why I told you that no one can come to me unless it is granted him by the Father.”"},{"chapter":6,"number":66,"file":"6.66.mp3","text":"After this many of his disciples turned back and no longer walked with him."},{"chapter":6,"number":67,"file":"6.67.mp3","text":"So Jesus said to the twelve, “Do you want to go away as well?”"},{"chapter":6,"number":68,"file":"6.68.mp3","text":"Simon Peter answered him, “Lord, to whom shall we go? You have the words of eternal life,"},{"chapter":6,"number":69,"file":"6.69.mp3","text":"and we have believed, and have come to know, that you are the Holy One of God.”"},{"chapter":6,"number":70,"file":"6.70.mp3","text":"Jesus answered them, “Did I not choose you, the twelve? And yet one of you is a devil.”"},{"chapter":6,"number":71,"file":"6.71.mp3","text":"He spoke of Judas the son of Simon Iscariot, for he, one of the twelve, was going to betray him."},{"chapter":7,"number":1,"file":"7.1.mp3","text":"After this Jesus went about in Galilee. He would not go about in Judea, because the Jews were seeking to kill him."},{"chapter":7,"number":2,"file":"7.2.mp3","text":"Now the Jews' Feast of Booths was at hand."},{"chapter":7,"number":3,"file":"7.3.mp3","text":"So his brothers said to him, “Leave here and go to Judea, that your disciples also may see the works you are doing."},{"chapter":7,"number":4,"file":"7.4.mp3","text":"For no one works in secret if he seeks to be known openly. If you do these things, show yourself to the world.”"},{"chapter":7,"number":5,"file":"7.5.mp3","text":"For not even his brothers believed in him."},{"chapter":7,"number":6,"file":"7.6.mp3","text":"Jesus said to them, “My time has not yet come, but your time is always here."},{"chapter":7,"number":7,"file":"7.7.mp3","text":"The world cannot hate you, but it hates me because I testify about it that its works are evil."},{"chapter":7,"number":8,"file":"7.8.mp3","text":"You go up to the feast. I am not going up to this feast, for my time has not yet fully come.”"},{"chapter":7,"number":9,"file":"7.9.mp3","text":"After saying this, he remained in Galilee."},{"chapter":7,"number":10,"file":"7.10.mp3","text":"But after his brothers had gone up to the feast, then he also went up, not publicly but in private."},{"chapter":7,"number":11,"file":"7.11.mp3","text":"The Jews were looking for him at the feast, and saying, “Where is he?”"},{"chapter":7,"number":12,"file":"7.12.mp3","text":"And there was much muttering about him among the people. While some said, “He is a good man,” others said, “No, he is leading the people astray.”"},{"chapter":7,"number":13,"file":"7.13.mp3","text":"Yet for fear of the Jews no one spoke openly of him."},{"chapter":7,"number":14,"file":"7.14.mp3","text":"About the middle of the feast Jesus went up into the temple and began teaching."},{"chapter":7,"number":15,"file":"7.15.mp3","text":"The Jews therefore marveled, saying, “How is it that this man has learning, when he has never studied?”"},{"chapter":7,"number":16,"file":"7.16.mp3","text":"So Jesus answered them, “My teaching is not mine, but his who sent me."},{"chapter":7,"number":17,"file":"7.17.mp3","text":"If anyone's will is to do God's will, he will know whether the teaching is from God or whether I am speaking on my own authority."},{"chapter":7,"number":18,"file":"7.18.mp3","text":"The one who speaks on his own authority seeks his own glory; but the one who seeks the glory of him who sent him is true, and in him there is no falsehood."},{"chapter":7,"number":19,"file":"7.19.mp3","text":"Has not Moses given you the law? Yet none of you keeps the law. Why do you seek to kill me?”"},{"chapter":7,"number":20,"file":"7.20.mp3","text":"The crowd answered, “You have a demon! Who is seeking to kill you?”"},{"chapter":7,"number":21,"file":"7.21.mp3","text":"Jesus answered them, “I did one work, and you all marvel at it."},{"chapter":7,"number":22,"file":"7.22.mp3","text":"Moses gave you circumcision (not that it is from Moses, but from the fathers), and you circumcise a man on the Sabbath."},{"chapter":7,"number":23,"file":"7.23.mp3","text":"If on the Sabbath a man receives circumcision, so that the law of Moses may not be broken, are you angry with me because on the Sabbath I made a man's whole body well?"},{"chapter":7,"number":24,"file":"7.24.mp3","text":"Do not judge by appearances, but judge with right judgment.”"},{"chapter":7,"number":25,"file":"7.25.mp3","text":"Some of the people of Jerusalem therefore said, “Is not this the man whom they seek to kill?"},{"chapter":7,"number":26,"file":"7.26.mp3","text":"And here he is, speaking openly, and they say nothing to him! Can it be that the authorities really know that this is the Christ?"},{"chapter":7,"number":27,"file":"7.27.mp3","text":"But we know where this man comes from, and when the Christ appears, no one will know where he comes from.”"},{"chapter":7,"number":28,"file":"7.28.mp3","text":"So Jesus proclaimed, as he taught in the temple, “You know me, and you know where I come from. But I have not come of my own accord. He who sent me is true, and him you do not know."},{"chapter":7,"number":29,"file":"7.29.mp3","text":"I know him, for I come from him, and he sent me.”"},{"chapter":7,"number":30,"file":"7.30.mp3","text":"So they were seeking to arrest him, but no one laid a hand on him, because his hour had not yet come."},{"chapter":7,"number":31,"file":"7.31.mp3","text":"Yet many of the people believed in him. They said, “When the Christ appears, will he do more signs than this man has done?”"},{"chapter":7,"number":32,"file":"7.32.mp3","text":"The Pharisees heard the crowd muttering these things about him, and the chief priests and Pharisees sent officers to arrest him."},{"chapter":7,"number":33,"file":"7.33.mp3","text":"Jesus then said, “I will be with you a little longer, and then I am going to him who sent me."},{"chapter":7,"number":34,"file":"7.34.mp3","text":"You will seek me and you will not find me. Where I am you cannot come.”"},{"chapter":7,"number":35,"file":"7.35.mp3","text":"The Jews said to one another, “Where does this man intend to go that we will not find him? Does he intend to go to the Dispersion among the Greeks and teach the Greeks?"},{"chapter":7,"number":36,"file":"7.36.mp3","text":"What does he mean by saying, ‘You will seek me and you will not find me,’ and, ‘Where I am you cannot come’?”"},{"chapter":7,"number":37,"file":"7.37.mp3","text":"On the last day of the feast, the great day, Jesus stood up and cried out, “If anyone thirsts, let him come to me and drink."},{"chapter":7,"number":38,"file":"7.38.mp3","text":"Whoever believes in me, as the Scripture has said, ‘Out of his heart will flow rivers of living water.’”"},{"chapter":7,"number":39,"file":"7.39.mp3","text":"Now this he said about the Spirit, whom those who believed in him were to receive, for as yet the Spirit had not been given, because Jesus was not yet glorified."},{"chapter":7,"number":40,"file":"7.40.mp3","text":"When they heard these words, some of the people said, “This really is the Prophet.”"},{"chapter":7,"number":41,"file":"7.41.mp3","text":"Others said, “This is the Christ.” But some said, “Is the Christ to come from Galilee?"},{"chapter":7,"number":42,"file":"7.42.mp3","text":"Has not the Scripture said that the Christ comes from the offspring of David, and comes from Bethlehem, the village where David was?”"},{"chapter":7,"number":43,"file":"7.43.mp3","text":"So there was a division among the people over him."},{"chapter":7,"number":44,"file":"7.44.mp3","text":"Some of them wanted to arrest him, but no one laid hands on him."},{"chapter":7,"number":45,"file":"7.45.mp3","text":"The officers then came to the chief priests and Pharisees, who said to them, “Why did you not bring him?”"},{"chapter":7,"number":46,"file":"7.46.mp3","text":"The officers answered, “No one ever spoke like this man!”"},{"chapter":7,"number":47,"file":"7.47.mp3","text":"The Pharisees answered them, “Have you also been deceived?"},{"chapter":7,"number":48,"file":"7.48.mp3","text":"Have any of the authorities or the Pharisees believed in him?"},{"chapter":7,"number":49,"file":"7.49.mp3","text":"But this crowd that does not know the law is accursed.”"},{"chapter":7,"number":50,"file":"7.50.mp3","text":"Nicodemus, who had gone to him before, and who was one of them, said to them,"},{"chapter":7,"number":51,"file":"7.51.mp3","text":"“Does our law judge a man without first giving him a hearing and learning what he does?”"},{"chapter":7,"number":52,"file":"7.52.mp3","text":"They replied, “Are you from Galilee too? Search and see that no prophet arises from Galilee.”"},{"chapter":7,"number":53,"file":"7.53.mp3","text":"They went each to his own house,"},{"chapter":8,"number":1,"file":"8.1.mp3","text":"but Jesus went to the Mount of Olives."},{"chapter":8,"number":2,"file":"8.2.mp3","text":"Early in the morning he came again to the temple. All the people came to him, and he sat down and taught them."},{"chapter":8,"number":3,"file":"8.3.mp3","text":"The scribes and the Pharisees brought a woman who had been caught in adultery, and placing her in the midst"},{"chapter":8,"number":4,"file":"8.4.mp3","text":"they said to him, “Teacher, this woman has been caught in the act of adultery."},{"chapter":8,"number":5,"file":"8.5.mp3","text":"Now in the Law, Moses commanded us to stone such women. So what do you say?”"},{"chapter":8,"number":6,"file":"8.6.mp3","text":"This they said to test him, that they might have some charge to bring against him. Jesus bent down and wrote with his finger on the ground."},{"chapter":8,"number":7,"file":"8.7.mp3","text":"And as they continued to ask him, he stood up and said to them, “Let him who is without sin among you be the first to throw a stone at her.”"},{"chapter":8,"number":8,"file":"8.8.mp3","text":"And once more he bent down and wrote on the ground."},{"chapter":8,"number":9,"file":"8.9.mp3","text":"But when they heard it, they went away one by one, beginning with the older ones, and Jesus was left alone with the woman standing before him."},{"chapter":8,"number":10,"file":"8.10.mp3","text":"Jesus stood up and said to her, “Woman, where are they? Has no one condemned you?”"},{"chapter":8,"number":11,"file":"8.11.mp3","text":"She said, “No one, Lord.” And Jesus said, “Neither do I condemn you; go, and from now on sin no more.”]]"},{"chapter":8,"number":12,"file":"8.12.mp3","text":"Again Jesus spoke to them, saying, “I am the light of the world. Whoever follows me will not walk in darkness, but will have the light of life.”"},{"chapter":8,"number":13,"file":"8.13.mp3","text":"So the Pharisees said to him, “You are bearing witness about yourself; your testimony is not true.”"},{"chapter":8,"number":14,"file":"8.14.mp3","text":"Jesus answered, “Even if I do bear witness about myself, my testimony is true, for I know where I came from and where I am going, but you do not know where I come from or where I am going."},{"chapter":8,"number":15,"file":"8.15.mp3","text":"You judge according to the flesh; I judge no one."},{"chapter":8,"number":16,"file":"8.16.mp3","text":"Yet even if I do judge, my judgment is true, for it is not I alone who judge, but I and the Father who sent me."},{"chapter":8,"number":17,"file":"8.17.mp3","text":"In your Law it is written that the testimony of two people is true."},{"chapter":8,"number":18,"file":"8.18.mp3","text":"I am the one who bears witness about myself, and the Father who sent me bears witness about me.”"},{"chapter":8,"number":19,"file":"8.19.mp3","text":"They said to him therefore, “Where is your Father?” Jesus answered, “You know neither me nor my Father. If you knew me, you would know my Father also.”"},{"chapter":8,"number":20,"file":"8.20.mp3","text":"These words he spoke in the treasury, as he taught in the temple; but no one arrested him, because his hour had not yet come."},{"chapter":8,"number":21,"file":"8.21.mp3","text":"So he said to them again, “I am going away, and you will seek me, and you will die in your sin. Where I am going, you cannot come.”"},{"chapter":8,"number":22,"file":"8.22.mp3","text":"So the Jews said, “Will he kill himself, since he says, ‘Where I am going, you cannot come’?”"},{"chapter":8,"number":23,"file":"8.23.mp3","text":"He said to them, “You are from below; I am from above. You are of this world; I am not of this world."},{"chapter":8,"number":24,"file":"8.24.mp3","text":"I told you that you would die in your sins, for unless you believe that I am he you will die in your sins.”"},{"chapter":8,"number":25,"file":"8.25.mp3","text":"So they said to him, “Who are you?” Jesus said to them, “Just what I have been telling you from the beginning."},{"chapter":8,"number":26,"file":"8.26.mp3","text":"I have much to say about you and much to judge, but he who sent me is true, and I declare to the world what I have heard from him.”"},{"chapter":8,"number":27,"file":"8.27.mp3","text":"They did not understand that he had been speaking to them about the Father."},{"chapter":8,"number":28,"file":"8.28.mp3","text":"So Jesus said to them, “When you have lifted up the Son of Man, then you will know that I am he, and that I do nothing on my own authority, but speak just as the Father taught me."},{"chapter":8,"number":29,"file":"8.29.mp3","text":"And he who sent me is with me. He has not left me alone, for I always do the things that are pleasing to him.”"},{"chapter":8,"number":30,"file":"8.30.mp3","text":"As he was saying these things, many believed in him."},{"chapter":8,"number":31,"file":"8.31.mp3","text":"So Jesus said to the Jews who had believed him, “If you abide in my word, you are truly my disciples,"},{"chapter":8,"number":32,"file":"8.32.mp3","text":"and you will know the truth, and the truth will set you free.”"},{"chapter":8,"number":33,"file":"8.33.mp3","text":"They answered him, “We are offspring of Abraham and have never been enslaved to anyone. How is it that you say, ‘You will become free’?”"},{"chapter":8,"number":34,"file":"8.34.mp3","text":"Jesus answered them, “Truly, truly, I say to you, everyone who practices sin is a slave to sin."},{"chapter":8,"number":35,"file":"8.35.mp3","text":"The slave does not remain in the house forever; the son remains forever."},{"chapter":8,"number":36,"file":"8.36.mp3","text":"So if the Son sets you free, you will be free indeed."},{"chapter":8,"number":37,"file":"8.37.mp3","text":"I know that you are offspring of Abraham; yet you seek to kill me because my word finds no place in you."},{"chapter":8,"number":38,"file":"8.38.mp3","text":"I speak of what I have seen with my Father, and you do what you have heard from your father.”"},{"chapter":8,"number":39,"file":"8.39.mp3","text":"They answered him, “Abraham is our father.” Jesus said to them, “If you were Abraham's children, you would be doing the works Abraham did,"},{"chapter":8,"number":40,"file":"8.40.mp3","text":"but now you seek to kill me, a man who has told you the truth that I heard from God. This is not what Abraham did."},{"chapter":8,"number":41,"file":"8.41.mp3","text":"You are doing the works your father did.” They said to him, “We were not born of sexual immorality. We have one Father—even God.”"},{"chapter":8,"number":42,"file":"8.42.mp3","text":"Jesus said to them, “If God were your Father, you would love me, for I came from God and I am here. I came not of my own accord, but he sent me."},{"chapter":8,"number":43,"file":"8.43.mp3","text":"Why do you not understand what I say? It is because you cannot bear to hear my word."},{"chapter":8,"number":44,"file":"8.44.mp3","text":"You are of your father the devil, and your will is to do your father's desires. He was a murderer from the beginning, and does not stand in the truth, because there is no truth in him. When he lies, he speaks out of his own character, for he is a liar and the father of lies."},{"chapter":8,"number":45,"file":"8.45.mp3","text":"But because I tell the truth, you do not believe me."},{"chapter":8,"number":46,"file":"8.46.mp3","text":"Which one of you convicts me of sin? If I tell the truth, why do you not believe me?"},{"chapter":8,"number":47,"file":"8.47.mp3","text":"Whoever is of God hears the words of God. The reason why you do not hear them is that you are not of God.”"},{"chapter":8,"number":48,"file":"8.48.mp3","text":"The Jews answered him, “Are we not right in saying that you are a Samaritan and have a demon?”"},{"chapter":8,"number":49,"file":"8.49.mp3","text":"Jesus answered, “I do not have a demon, but I honor my Father, and you dishonor me."},{"chapter":8,"number":50,"file":"8.50.mp3","text":"Yet I do not seek my own glory; there is One who seeks it, and he is the judge."},{"chapter":8,"number":51,"file":"8.51.mp3","text":"Truly, truly, I say to you, if anyone keeps my word, he will never see death.”"},{"chapter":8,"number":52,"file":"8.52.mp3","text":"The Jews said to him, “Now we know that you have a demon! Abraham died, as did the prophets, yet you say, ‘If anyone keeps my word, he will never taste death.’"},{"chapter":8,"number":53,"file":"8.53.mp3","text":"Are you greater than our father Abraham, who died? And the prophets died! Who do you make yourself out to be?”"},{"chapter":8,"number":54,"file":"8.54.mp3","text":"Jesus answered, “If I glorify myself, my glory is nothing. It is my Father who glorifies me, of whom you say, ‘He is our God.’"},{"chapter":8,"number":55,"file":"8.55.mp3","text":"But you have not known him. I know him. If I were to say that I do not know him, I would be a liar like you, but I do know him and I keep his word."},{"chapter":8,"number":56,"file":"8.56.mp3","text":"Your father Abraham rejoiced that he would see my day. He saw it and was glad.”"},{"chapter":8,"number":57,"file":"8.57.mp3","text":"So the Jews said to him, “You are not yet fifty years old, and have you seen Abraham?”"},{"chapter":8,"number":58,"file":"8.58.mp3","text":"Jesus said to them, “Truly, truly, I say to you, before Abraham was, I am.”"},{"chapter":8,"number":59,"file":"8.59.mp3","text":"So they picked up stones to throw at him, but Jesus hid himself and went out of the temple."},{"chapter":9,"number":1,"file":"9.1.mp3","text":"As he passed by, he saw a man blind from birth."},{"chapter":9,"number":2,"file":"9.2.mp3","text":"And his disciples asked him, “Rabbi, who sinned, this man or his parents, that he was born blind?”"},{"chapter":9,"number":3,"file":"9.3.mp3","text":"Jesus answered, “It was not that this man sinned, or his parents, but that the works of God might be displayed in him."},{"chapter":9,"number":4,"file":"9.4.mp3","text":"We must work the works of him who sent me while it is day; night is coming, when no one can work."},{"chapter":9,"number":5,"file":"9.5.mp3","text":"As long as I am in the world, I am the light of the world.”"},{"chapter":9,"number":6,"file":"9.6.mp3","text":"Having said these things, he spit on the ground and made mud with the saliva. Then he anointed the man's eyes with the mud"},{"chapter":9,"number":7,"file":"9.7.mp3","text":"and said to him, “Go, wash in the pool of Siloam” (which means Sent). So he went and washed and came back seeing."},{"chapter":9,"number":8,"file":"9.8.mp3","text":"The neighbors and those who had seen him before as a beggar were saying, “Is this not the man who used to sit and beg?”"},{"chapter":9,"number":9,"file":"9.9.mp3","text":"Some said, “It is he.” Others said, “No, but he is like him.” He kept saying, “I am the man.”"},{"chapter":9,"number":10,"file":"9.10.mp3","text":"So they said to him, “Then how were your eyes opened?”"},{"chapter":9,"number":11,"file":"9.11.mp3","text":"He answered, “The man called Jesus made mud and anointed my eyes and said to me, ‘Go to Siloam and wash.’ So I went and washed and received my sight.”"},{"chapter":9,"number":12,"file":"9.12.mp3","text":"They said to him, “Where is he?” He said, “I do not know.”"},{"chapter":9,"number":13,"file":"9.13.mp3","text":"They brought to the Pharisees the man who had formerly been blind."},{"chapter":9,"number":14,"file":"9.14.mp3","text":"Now it was a Sabbath day when Jesus made the mud and opened his eyes."},{"chapter":9,"number":15,"file":"9.15.mp3","text":"So the Pharisees again asked him how he had received his sight. And he said to them, “He put mud on my eyes, and I washed, and I see.”"},{"chapter":9,"number":16,"file":"9.16.mp3","text":"Some of the Pharisees said, “This man is not from God, for he does not keep the Sabbath.” But others said, “How can a man who is a sinner do such signs?” And there was a division among them."},{"chapter":9,"number":17,"file":"9.17.mp3","text":"So they said again to the blind man, “What do you say about him, since he has opened your eyes?” He said, “He is a prophet.”"},{"chapter":9,"number":18,"file":"9.18.mp3","text":"The Jews did not believe that he had been blind and had received his sight, until they called the parents of the man who had received his sight"},{"chapter":9,"number":19,"file":"9.19.mp3","text":"and asked them, “Is this your son, who you say was born blind? How then does he now see?”"},{"chapter":9,"number":20,"file":"9.20.mp3","text":"His parents answered, “We know that this is our son and that he was born blind."},{"chapter":9,"number":21,"file":"9.21.mp3","text":"But how he now sees we do not know, nor do we know who opened his eyes. Ask him; he is of age. He will speak for himself.”"},{"chapter":9,"number":22,"file":"9.22.mp3","text":"(His parents said these things because they feared the Jews, for the Jews had already agreed that if anyone should confess Jesus to be Christ, he was to be put out of the synagogue.)"},{"chapter":9,"number":23,"file":"9.23.mp3","text":"Therefore his parents said, “He is of age; ask him.”"},{"chapter":9,"number":24,"file":"9.24.mp3","text":"So for the second time they called the man who had been blind and said to him, “Give glory to God. We know that this man is a sinner.”"},{"chapter":9,"number":25,"file":"9.25.mp3","text":"He answered, “Whether he is a sinner I do not know. One thing I do know, that though I was blind, now I see.”"},{"chapter":9,"number":26,"file":"9.26.mp3","text":"They said to him, “What did he do to you? How did he open your eyes?”"},{"chapter":9,"number":27,"file":"9.27.mp3","text":"He answered them, “I have told you already, and you would not listen. Why do you want to hear it again? Do you also want to become his disciples?”"},{"chapter":9,"number":28,"file":"9.28.mp3","text":"And they reviled him, saying, “You are his disciple, but we are disciples of Moses."},{"chapter":9,"number":29,"file":"9.29.mp3","text":"We know that God has spoken to Moses, but as for this man, we do not know where he comes from.”"},{"chapter":9,"number":30,"file":"9.30.mp3","text":"The man answered, “Why, this is an amazing thing! You do not know where he comes from, and yet he opened my eyes."},{"chapter":9,"number":31,"file":"9.31.mp3","text":"We know that God does not listen to sinners, but if anyone is a worshiper of God and does his will, God listens to him."},{"chapter":9,"number":32,"file":"9.32.mp3","text":"Never since the world began has it been heard that anyone opened the eyes of a man born blind."},{"chapter":9,"number":33,"file":"9.33.mp3","text":"If this man were not from God, he could do nothing.”"},{"chapter":9,"number":34,"file":"9.34.mp3","text":"They answered him, “You were born in utter sin, and would you teach us?” And they cast him out."},{"chapter":9,"number":35,"file":"9.35.mp3","text":"Jesus heard that they had cast him out, and having found him he said, “Do you believe in the Son of Man?”"},{"chapter":9,"number":36,"file":"9.36.mp3","text":"He answered, “And who is he, sir, that I may believe in him?”"},{"chapter":9,"number":37,"file":"9.37.mp3","text":"Jesus said to him, “You have seen him, and it is he who is speaking to you.”"},{"chapter":9,"number":38,"file":"9.38.mp3","text":"He said, “Lord, I believe,” and he worshiped him."},{"chapter":9,"number":39,"file":"9.39.mp3","text":"Jesus said, “For judgment I came into this world, that those who do not see may see, and those who see may become blind.”"},{"chapter":9,"number":40,"file":"9.40.mp3","text":"Some of the Pharisees near him heard these things, and said to him, “Are we also blind?”"},{"chapter":9,"number":41,"file":"9.41.mp3","text":"Jesus said to them, “If you were blind, you would have no guilt; but now that you say, ‘We see,’ your guilt remains."},{"chapter":10,"number":1,"file":"10.1.mp3","text":"“Truly, truly, I say to you, he who does not enter the sheepfold by the door but climbs in by another way, that man is a thief and a robber."},{"chapter":10,"number":2,"file":"10.2.mp3","text":"But he who enters by the door is the shepherd of the sheep."},{"chapter":10,"number":3,"file":"10.3.mp3","text":"To him the gatekeeper opens. The sheep hear his voice, and he calls his own sheep by name and leads them out."},{"chapter":10,"number":4,"file":"10.4.mp3","text":"When he has brought out all his own, he goes before them, and the sheep follow him, for they know his voice."},{"chapter":10,"number":5,"file":"10.5.mp3","text":"A stranger they will not follow, but they will flee from him, for they do not know the voice of strangers.”"},{"chapter":10,"number":6,"file":"10.6.mp3","text":"This figure of speech Jesus used with them, but they did not understand what he was saying to them."},{"chapter":10,"number":7,"file":"10.7.mp3","text":"So Jesus again said to them, “Truly, truly, I say to you, I am the door of the sheep."},{"chapter":10,"number":8,"file":"10.8.mp3","text":"All who came before me are thieves and robbers, but the sheep did not listen to them."},{"chapter":10,"number":9,"file":"10.9.mp3","text":"I am the door. If anyone enters by me, he will be saved and will go in and out and find pasture."},{"chapter":10,"number":10,"file":"10.10.mp3","text":"The thief comes only to steal and kill and destroy. I came that they may have life and have it abundantly."},{"chapter":10,"number":11,"file":"10.11.mp3","text":"I am the good shepherd. The good shepherd lays down his life for the sheep."},{"chapter":10,"number":12,"file":"10.12.mp3","text":"He who is a hired hand and not a shepherd, who does not own the sheep, sees the wolf coming and leaves the sheep and flees, and the wolf snatches them and scatters them."},{"chapter":10,"number":13,"file":"10.13.mp3","text":"He flees because he is a hired hand and cares nothing for the sheep."},{"chapter":10,"number":14,"file":"10.14.mp3","text":"I am the good shepherd. I know my own and my own know me,"},{"chapter":10,"number":15,"file":"10.15.mp3","text":"just as the Father knows me and I know the Father; and I lay down my life for the sheep."},{"chapter":10,"number":16,"file":"10.16.mp3","text":"And I have other sheep that are not of this fold. I must bring them also, and they will listen to my voice. So there will be one flock, one shepherd."},{"chapter":10,"number":17,"file":"10.17.mp3","text":"For this reason the Father loves me, because I lay down my life that I may take it up again."},{"chapter":10,"number":18,"file":"10.18.mp3","text":"No one takes it from me, but I lay it down of my own accord. I have authority to lay it down, and I have authority to take it up again. This charge I have received from my Father.”"},{"chapter":10,"number":19,"file":"10.19.mp3","text":"There was again a division among the Jews because of these words."},{"chapter":10,"number":20,"file":"10.20.mp3","text":"Many of them said, “He has a demon, and is insane; why listen to him?”"},{"chapter":10,"number":21,"file":"10.21.mp3","text":"Others said, “These are not the words of one who is oppressed by a demon. Can a demon open the eyes of the blind?”"},{"chapter":10,"number":22,"file":"10.22.mp3","text":"At that time the Feast of Dedication took place at Jerusalem. It was winter,"},{"chapter":10,"number":23,"file":"10.23.mp3","text":"and Jesus was walking in the temple, in the colonnade of Solomon."},{"chapter":10,"number":24,"file":"10.24.mp3","text":"So the Jews gathered around him and said to him, “How long will you keep us in suspense? If you are the Christ, tell us plainly.”"},{"chapter":10,"number":25,"file":"10.25.mp3","text":"Jesus answered them, “I told you, and you do not believe. The works that I do in my Father's name bear witness about me,"},{"chapter":10,"number":26,"file":"10.26.mp3","text":"but you do not believe because you are not among my sheep."},{"chapter":10,"number":27,"file":"10.27.mp3","text":"My sheep hear my voice, and I know them, and they follow me."},{"chapter":10,"number":28,"file":"10.28.mp3","text":"I give them eternal life, and they will never perish, and no one will snatch them out of my hand."},{"chapter":10,"number":29,"file":"10.29.mp3","text":"My Father, who has given them to me, is greater than all, and no one is able to snatch them out of the Father's hand."},{"chapter":10,"number":30,"file":"10.30.mp3","text":"I and the Father are one.”"},{"chapter":10,"number":31,"file":"10.31.mp3","text":"The Jews picked up stones again to stone him."},{"chapter":10,"number":32,"file":"10.32.mp3","text":"Jesus answered them, “I have shown you many good works from the Father; for which of them are you going to stone me?”"},{"chapter":10,"number":33,"file":"10.33.mp3","text":"The Jews answered him, “It is not for a good work that we are going to stone you but for blasphemy, because you, being a man, make yourself God.”"},{"chapter":10,"number":34,"file":"10.34.mp3","text":"Jesus answered them, “Is it not written in your Law, ‘I said, you are gods’?"},{"chapter":10,"number":35,"file":"10.35.mp3","text":"If he called them gods to whom the word of God came—and Scripture cannot be broken—"},{"chapter":10,"number":36,"file":"10.36.mp3","text":"do you say of him whom the Father consecrated and sent into the world, ‘You are blaspheming,’ because I said, ‘I am the Son of God’?"},{"chapter":10,"number":37,"file":"10.37.mp3","text":"If I am not doing the works of my Father, then do not believe me;"},{"chapter":10,"number":38,"file":"10.38.mp3","text":"but if I do them, even though you do not believe me, believe the works, that you may know and understand that the Father is in me and I am in the Father.”"},{"chapter":10,"number":39,"file":"10.39.mp3","text":"Again they sought to arrest him, but he escaped from their hands."},{"chapter":10,"number":40,"file":"10.40.mp3","text":"He went away again across the Jordan to the place where John had been baptizing at first, and there he remained."},{"chapter":10,"number":41,"file":"10.41.mp3","text":"And many came to him. And they said, “John did no sign, but everything that John said about this man was true.”"},{"chapter":10,"number":42,"file":"10.42.mp3","text":"And many believed in him there."},{"chapter":11,"number":1,"file":"11.1.mp3","text":"Now a certain man was ill, Lazarus of Bethany, the village of Mary and her sister Martha."},{"chapter":11,"number":2,"file":"11.2.mp3","text":"It was Mary who anointed the Lord with ointment and wiped his feet with her hair, whose brother Lazarus was ill."},{"chapter":11,"number":3,"file":"11.3.mp3","text":"So the sisters sent to him, saying, “Lord, he whom you love is ill.”"},{"chapter":11,"number":4,"file":"11.4.mp3","text":"But when Jesus heard it he said, “This illness does not lead to death. It is for the glory of God, so that the Son of God may be glorified through it.”"},{"chapter":11,"number":5,"file":"11.5.mp3","text":"Now Jesus loved Martha and her sister and Lazarus."},{"chapter":11,"number":6,"file":"11.6.mp3","text":"So, when he heard that Lazarus was ill, he stayed two days longer in the place where he was."},{"chapter":11,"number":7,"file":"11.7.mp3","text":"Then after this he said to the disciples, “Let us go to Judea again.”"},{"chapter":11,"number":8,"file":"11.8.mp3","text":"The disciples said to him, “Rabbi, the Jews were just now seeking to stone you, and are you going there again?”"},{"chapter":11,"number":9,"file":"11.9.mp3","text":"Jesus answered, “Are there not twelve hours in the day? If anyone walks in the day, he does not stumble, because he sees the light of this world."},{"chapter":11,"number":10,"file":"11.10.mp3","text":"But if anyone walks in the night, he stumbles, because the light is not in him.”"},{"chapter":11,"number":11,"file":"11.11.mp3","text":"After saying these things, he said to them, “Our friend Lazarus has fallen asleep, but I go to awaken him.”"},{"chapter":11,"number":12,"file":"11.12.mp3","text":"The disciples said to him, “Lord, if he has fallen asleep, he will recover.”"},{"chapter":11,"number":13,"file":"11.13.mp3","text":"Now Jesus had spoken of his death, but they thought that he meant taking rest in sleep."},{"chapter":11,"number":14,"file":"11.14.mp3","text":"Then Jesus told them plainly, “Lazarus has died,"},{"chapter":11,"number":15,"file":"11.15.mp3","text":"and for your sake I am glad that I was not there, so that you may believe. But let us go to him.”"},{"chapter":11,"number":16,"file":"11.16.mp3","text":"So Thomas, called the Twin, said to his fellow disciples, “Let us also go, that we may die with him.”"},{"chapter":11,"number":17,"file":"11.17.mp3","text":"Now when Jesus came, he found that Lazarus had already been in the tomb four days."},{"chapter":11,"number":18,"file":"11.18.mp3","text":"Bethany was near Jerusalem, about two miles off,"},{"chapter":11,"number":19,"file":"11.19.mp3","text":"and many of the Jews had come to Martha and Mary to console them concerning their brother."},{"chapter":11,"number":20,"file":"11.20.mp3","text":"So when Martha heard that Jesus was coming, she went and met him, but Mary remained seated in the house."},{"chapter":11,"number":21,"file":"11.21.mp3","text":"Martha said to Jesus, “Lord, if you had been here, my brother would not have died."},{"chapter":11,"number":22,"file":"11.22.mp3","text":"But even now I know that whatever you ask from God, God will give you.”"},{"chapter":11,"number":23,"file":"11.23.mp3","text":"Jesus said to her, “Your brother will rise again.”"},{"chapter":11,"number":24,"file":"11.24.mp3","text":"Martha said to him, “I know that he will rise again in the resurrection on the last day.”"},{"chapter":11,"number":25,"file":"11.25.mp3","text":"Jesus said to her, “I am the resurrection and the life. Whoever believes in me, though he die, yet shall he live,"},{"chapter":11,"number":26,"file":"11.26.mp3","text":"and everyone who lives and believes in me shall never die. Do you believe this?”"},{"chapter":11,"number":27,"file":"11.27.mp3","text":"She said to him, “Yes, Lord; I believe that you are the Christ, the Son of God, who is coming into the world.”"},{"chapter":11,"number":28,"file":"11.28.mp3","text":"When she had said this, she went and called her sister Mary, saying in private, “The Teacher is here and is calling for you.”"},{"chapter":11,"number":29,"file":"11.29.mp3","t

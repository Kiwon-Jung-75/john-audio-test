<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>요한복음 1장 · 1–2절</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2f0;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
main{max-width:720px;margin:auto;padding:14px 12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
header{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#756f69}.badge{border:1px solid #d8d2cd;border-radius:24px;padding:7px 12px}
h1{font-weight:300;font-size:26px;line-height:1.3;text-align:center;margin:20px 0;letter-spacing:-.03em}
.player{background:#272a2c;border-radius:12px;padding:24px 18px;color:#fff;min-height:178px;cursor:grab}.player:active{cursor:grabbing}
.row{display:flex;gap:16px;align-items:center;justify-content:space-between}.play{width:58px;height:58px;border:0;border-radius:50%;font-size:24px;background:#e9eaeb;color:#222;flex-shrink:0}
.track{flex:1}.track strong{display:block;font-size:15px;font-weight:500}.time{font-size:13px;color:#c7c9cc;margin-top:9px;font-variant-numeric:tabular-nums}
.seek{display:block;width:100%;margin:24px 0 0;accent-color:#a8c7fa;touch-action:none;cursor:pointer}.mute{border:0;background:transparent;color:#d4d7da;min-height:38px;font-size:13px;padding:8px 0}
nav{display:flex;gap:16px;justify-content:space-between;margin-top:14px}nav button{min-height:44px;min-width:114px;border:0;border-radius:7px;background:#ffdc53;font-size:16px;padding:10px 14px;color:#28251b}button{cursor:pointer}button:disabled{opacity:.3;cursor:default}button:focus-visible,input:focus-visible{outline:3px solid #5879cb;outline-offset:3px}
.hint{font-size:12px;line-height:1.6;color:#756f69;text-align:center;margin:14px 0 0}.error{color:#9b2525;font-size:13px;line-height:1.6}.error:empty{display:none}@media(min-width:600px){h1{font-size:38px}.player{max-width:540px;margin:auto}}
</style>
</head>
<body>
<main id="reader">
 <header><span>요한복음 1장</span><span id="reference" class="badge" aria-live="polite">1절</span></header>
 <h1 id="words">In the beginning was the Word, and the Word was with God, and the Word was God.</h1>
 <div class="player" id="player" role="group" aria-label="오디오 재생 및 스와이프 영역">
  <div class="row"><button class="play" id="play" aria-label="재생">▶</button><div class="track"><strong id="trackTitle">John 1:1</strong><div class="time" id="time">0:00 / —</div></div></div>
  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="재생 위치" disabled>
  <button class="mute" id="mute" aria-label="소리 끄기">🔊 소리</button>
 </div>
 <nav aria-label="절 이동"><button id="previous" disabled>← 1절</button><button id="next">2절 →</button></nav>
 <p class="hint">본문이나 검정 플레이어를 좌우로 쓸어넘기세요.<br>재생 막대를 끌면 재생 위치가 바뀝니다.<br>아이폰의 음량은 기기 음량 버튼으로 조절하세요.</p>
 <p class="error" id="status" role="status"></p>
 <audio id="audio" preload="metadata"></audio>
</main>
<script>
// 이 index.html과 같은 폴더에 아래 두 MP3 파일을 올리세요.
const verses = [
 {number:1, file:'1.1.mp3', text:'In the beginning was the Word, and the Word was with God, and the Word was God.'},
 {number:2, file:'1.2.mp3', text:'He was in the beginning with God.'}
];
const reader=document.getElementById('reader'),audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),previous=document.getElementById('previous'),next=document.getElementById('next'),mute=document.getElementById('mute'),status=document.getElementById('status');
let current=-1,gesture=null,suppressClickUntil=0,loadVersion=0;
const format=s=>Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'—';
function update(){const duration=audio.duration;document.getElementById('time').textContent=format(audio.currentTime)+' / '+format(duration);seek.disabled=!(Number.isFinite(duration)&&duration>0);if(!seek.disabled)seek.value=Math.round(audio.currentTime/duration*1000);play.textContent=audio.paused?'▶':'❚❚';play.setAttribute('aria-label',audio.paused?'재생':'일시 정지');}
function show(index){if(index<0||index>=verses.length||index===current)return;loadVersion++;audio.pause();current=index;const verse=verses[index];audio.src=verse.file;audio.load();seek.value=0;seek.disabled=true;status.textContent='';document.getElementById('words').textContent=verse.text;document.getElementById('reference').textContent=verse.number+'절';document.getElementById('trackTitle').textContent='John 1:'+verse.number;previous.disabled=index===0;next.disabled=index===verses.length-1;reader.dataset.verse='1.'+verse.number;update();}
play.addEventListener('click',async()=>{if(!audio.paused){audio.pause();return;}const version=loadVersion;try{await audio.play();}catch(error){if(version===loadVersion&&error.name!=='AbortError')status.textContent='재생되지 않습니다. 같은 폴더에 '+verses[current].file+' 파일이 있는지 확인한 뒤 다시 재생해 주세요.';}});
mute.addEventListener('click',()=>{audio.muted=!audio.muted;mute.textContent=audio.muted?'🔇 음소거':'🔊 소리';mute.setAttribute('aria-label',audio.muted?'소리 켜기':'소리 끄기');});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=Number(seek.value)/1000*audio.duration;});
for(const event of ['loadedmetadata','durationchange','timeupdate','play','pause','ended'])audio.addEventListener(event,update);
audio.addEventListener('error',()=>{status.textContent=verses[current].file+' 파일을 불러오지 못했습니다. 파일 이름과 업로드 위치를 확인해 주세요.';});
previous.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));
reader.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('input,a'))return;gesture={x:e.clientX,y:e.clientY,id:e.pointerId};if(!e.target.closest('button'))reader.setPointerCapture(e.pointerId);},true);
reader.addEventListener('pointerup',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.4){suppressClickUntil=performance.now()+500;show(current+(dx<0?1:-1));}},true);
reader.addEventListener('pointercancel',()=>gesture=null,true);
reader.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){e.preventDefault();e.stopImmediatePropagation();}},true);
document.addEventListener('keydown',e=>{if(e.target.closest('input'))return;if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1);});
show(new URLSearchParams(location.search).get('start')==='2'?1:0);
</script>
</body></html>
